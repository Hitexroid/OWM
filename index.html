<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>OWM — سامانه مدیریت سفارش‌ها</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.14);--stroke-soft:rgba(255,255,255,.08);
  --txt:#eef4fb;--txt2:rgba(228,238,248,.62);--txt3:rgba(228,238,248,.38);
  --teal:#2dd4bf;--teal-soft:rgba(45,212,191,.14);
  --gold:#f6b73c;--sky:#5bc8f5;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;
  --purple:#a78bfa;--r:16px;--chip-bg:rgba(255,255,255,.07);--overlay:rgba(4,10,20,.62);
}
html.light{
  --bg:#f5f7fa;--panel:rgba(255,255,255,.85);--panel2:rgba(255,255,255,.95);
  --stroke:rgba(15,23,42,.1);--stroke-soft:rgba(15,23,42,.06);
  --txt:#0f172a;--txt2:rgba(15,23,42,.7);--txt3:rgba(15,23,42,.45);
  --chip-bg:rgba(15,23,42,.05);--overlay:rgba(15,23,42,.4);
}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.8;font-size:14.5px;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}svg{display:block}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:9px}
:focus-visible{outline:2px solid rgba(45,212,191,.7);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(155deg,#0a1120 0%,#0d1b2e 45%,#0a2330 100%);overflow:hidden;transition:opacity .3s}
html.light .bg{opacity:.15}
.bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:26px 26px}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);display:block}
.b1{width:52vmax;height:52vmax;background:radial-gradient(circle,rgba(20,184,166,.42),transparent 62%);top:-16vmax;right:-12vmax;animation:fl1 26s ease-in-out infinite alternate}
.b2{width:44vmax;height:44vmax;background:radial-gradient(circle,rgba(246,183,60,.22),transparent 62%);bottom:-14vmax;left:-10vmax;animation:fl2 32s ease-in-out infinite alternate}
.b3{width:38vmax;height:38vmax;background:radial-gradient(circle,rgba(56,152,224,.28),transparent 62%);top:32%;left:28%;animation:fl3 38s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(-6vmax,8vmax) scale(1.12)}}
@keyframes fl2{to{transform:translate(7vmax,-6vmax) scale(1.15)}}
@keyframes fl3{to{transform:translate(-8vmax,-5vmax) scale(.9)}}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:0 16px 40px rgba(2,8,23,.25),inset 0 1px 0 rgba(255,255,255,.08)}
html.light .glass{background:rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);padding:30px 24px;animation:rise .6s both}
.logo{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:8px}
.logo-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:1.5px;color:#032522;background:linear-gradient(135deg,#5eead4,#0d9488 70%);box-shadow:0 12px 30px rgba(45,212,191,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:rotate(-4deg)}
.brand-name{font-size:38px;font-weight:900;line-height:1;letter-spacing:2px}
.brand-sub{color:var(--txt2);font-size:12.5px;margin-bottom:6px;text-align:center}
.frow{margin-top:14px}
.frow label,.flbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:11px 14px;color:var(--txt);transition:.2s;min-height:48px;font-size:15px}
.inp::placeholder{color:var(--txt3)}
.inp:focus{outline:none;border-color:rgba(45,212,191,.7);box-shadow:0 0 0 4px rgba(45,212,191,.14)}
select.inp option{background:var(--bg);color:var(--txt)}
textarea.inp{resize:vertical;min-height:90px}
.pwd{position:relative}.pwd .inp{padding-left:52px}
.pwd button{position:absolute;top:5px;bottom:5px;left:6px;width:40px;border:none;background:none;color:var(--txt3);display:grid;place-items:center;border-radius:10px}
.ferr{font-size:12.5px;margin-top:10px;text-align:center;min-height:20px;font-weight:700;color:var(--red)}
.fnote{font-size:11.5px;color:var(--txt3);margin-top:5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;margin-top:14px}
.switch-row>span:first-child{font-weight:700;font-size:13.5px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;z-index:2;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--chip-bg);border:1px solid var(--stroke);border-radius:99px;transition:.25s}
.switch i:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#cbd5e1;top:3px;right:3px;transition:.25s}
.switch input:checked+i{background:rgba(45,212,191,.35);border-color:rgba(45,212,191,.6)}
.switch input:checked+i:after{right:26px;background:var(--teal)}
.switch input:disabled+i{opacity:.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;transition:.2s;min-height:48px;text-decoration:none}
.btn:active{transform:scale(.96)}.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(135deg,#2dd4bf,#0e9f9a);color:#04211f;box-shadow:0 8px 22px rgba(45,212,191,.28)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ok{background:linear-gradient(135deg,#4ade80,#16a34a);color:#05240f;box-shadow:0 8px 20px rgba(74,222,128,.25)}
.btn-dng{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.3)}
.btn-gh{background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt)}
.btn-gh:hover{background:var(--panel2)}
.btn-blk{width:100%}
.btn-sm{min-height:40px;padding:7px 13px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-sm svg{width:15px;height:15px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%}
.btn-icon svg{width:18px;height:18px}
.btn:disabled{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-pending{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}
.b-approved{color:#86efac;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.b-rejected,.b-cancelled{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
.b-seen{color:#93c5fd;background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.4)}
.b-in_progress{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.42)}
.b-need_production{color:#d8b4fe;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.4)}
.b-completed{color:#86efac;background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45)}
.b-shipped{color:#c7d2fe;background:rgba(165,180,252,.14);border-color:rgba(165,180,252,.45)}
.b-return_requested{color:#fcd34d;background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55);animation:pulseBd 1.4s infinite}
.b-returned_healthy{color:#86efac;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.b-returned_broken{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
@keyframes pulseBd{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.35)}50%{box-shadow:0 0 0 6px rgba(251,191,36,0)}}
.b-sample{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.42)}
.b-ver{color:var(--txt2);background:var(--chip-bg);border-color:var(--stroke)}
.b-pin{color:#fcd34d;background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55)}
.r-admin{color:#ffd98a;background:rgba(246,183,60,.13);border-color:rgba(246,183,60,.4)}
.r-accountant{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.4)}
.r-sales{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.r-officer{color:#d8b4fe;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.4)}
.r-active{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.r-inactive{color:var(--txt3);background:var(--chip-bg);border-color:var(--stroke)}
#view-app{display:none;min-height:100vh}
.topbar{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:10px;margin:10px 12px 0;padding:9px 14px}
.tb-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:10.5px;letter-spacing:1px;color:#032522;background:linear-gradient(135deg,#5eead4,#0d9488);box-shadow:0 6px 16px rgba(45,212,191,.3);flex:none;user-select:none;cursor:pointer}
.tb-title{font-size:16.5px;font-weight:900;line-height:1.2}
.sync-chip{margin-right:auto;display:flex;align-items:center;gap:7px;background:var(--chip-bg);border:1px solid var(--stroke);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap}
.sync-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.sync-chip.ok .dot{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.7)}
.sync-chip.off .dot{background:var(--red)}
.tb-user{text-align:right;line-height:1.4;min-width:0}
.tb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20vw}
.tb-user span{font-size:10.5px;color:var(--txt2)}
.tb-out{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--stroke);background:var(--panel2);color:var(--txt2);display:grid;place-items:center;transition:.2s}
.tb-out:hover{color:#fff;background:rgba(255,255,255,.14)}
main{padding:16px 14px 120px;max-width:1100px;margin:0 auto}
.page{display:none}.page.active{display:block;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.sidenav{display:none}
@media(min-width:920px){.bottomnav{display:none!important}.sidenav{display:flex;flex-direction:column;gap:6px;position:fixed;top:82px;right:18px;width:216px;padding:12px;z-index:30}main{margin-right:250px}.topbar{margin:12px 18px 0}}
.bn-btn,.sn-btn{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--txt3);font-weight:800;font-size:12px;border-radius:14px;transition:.22s}
.bn-btn{flex-direction:column;gap:3px;padding:7px 12px;font-size:10.5px}
.bn-btn svg,.sn-btn svg{width:22px;height:22px}
.sn-btn{padding:11px 14px;font-size:13.5px;width:100%;text-align:right}
.bn-btn.on,.sn-btn.on{color:#7ff5e6;background:var(--teal-soft);box-shadow:inset 0 0 0 1px rgba(45,212,191,.35)}
.bottomnav{position:fixed;bottom:10px;left:10px;right:10px;z-index:40;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.welcome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;margin-bottom:16px}
.welcome h2{font-size:19px;font-weight:900}.welcome p{font-size:12.5px;color:var(--txt2)}
.welcome .btn{margin-right:auto}
.quote-card{background:linear-gradient(135deg,rgba(45,212,191,.08),rgba(246,183,60,.05));padding:14px 18px;margin-bottom:16px;border-radius:14px;border:1px solid var(--stroke);font-size:13.5px;color:var(--txt2);display:flex;align-items:center;gap:10px}
.quote-card .q-icon{font-size:22px}
.alert-banner{background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(251,191,36,.05));border:1px solid rgba(251,191,36,.4);color:#fcd34d;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;animation:pulseBd 1.6s infinite}
.alert-banner svg{width:19px;height:19px;flex:none}
.offline-banner{background:linear-gradient(135deg,rgba(251,113,133,.14),rgba(251,113,133,.05));border:1px solid rgba(251,113,133,.4);color:#fda4af;border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
@media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;gap:12px;align-items:center;padding:15px 16px;transition:.25s}
.stat:hover{transform:translateY(-2px)}
.s-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.s-ic svg{width:22px;height:22px}
.s-num{font-size:23px;font-weight:900;line-height:1.3}.s-lbl{font-size:11.5px;color:var(--txt2)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.subhead h3{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:8px}
.subhead h3 svg{width:18px;height:18px;color:var(--teal)}
.subhead button{border:none;background:none;color:#7ff5e6;font-size:12.5px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt2);font-size:12.5px;font-weight:700;transition:.2s;min-height:40px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,rgba(45,212,191,.28),rgba(45,212,191,.08));color:#7ff5e6;border-color:rgba(45,212,191,.55)}
.custom-range{margin-top:12px;padding:14px;display:grid;gap:10px}
.custom-range .cr-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.custom-range .cr-row>span{font-size:12.5px;font-weight:800;color:var(--txt2)}
.search{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--stroke);border-radius:13px;padding:0 14px;min-height:48px;margin-top:12px}
.search:focus-within{border-color:rgba(45,212,191,.6)}
.search svg{color:var(--txt3);flex:none;width:18px;height:18px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);min-height:46px;font-size:14px}
.filter-bar{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.filter-chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.filter-chip.on{background:var(--teal);color:#04211f;border-color:var(--teal)}
.ocount{font-size:12px;color:var(--txt3);margin:12px 2px 8px}
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{padding:16px;transition:.25s;position:relative}
.ocard.pinned{border-color:rgba(251,191,36,.55);background:linear-gradient(135deg,rgba(251,191,36,.06),transparent)}
.ocard-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.ono{font-weight:900;font-size:14px;background:var(--panel2);padding:3px 12px;border-radius:10px;border:1px solid var(--stroke)}
.oprev{position:relative;width:100%;height:90px;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--stroke);cursor:pointer;margin-bottom:8px}
.oprev:hover{border-color:var(--teal)}
.oprev img{position:absolute;left:50%;top:50%;height:120%;width:auto;transform:translate(-50%,-50%) rotate(90deg);object-fit:cover}
.oprev-dl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);transition:.2s;opacity:1}
.oprev-dl.loaded{opacity:0;pointer-events:none}
.oprev:hover .oprev-dl.loaded{opacity:1;pointer-events:auto}
.oprev-dl button{width:48px;height:48px;border-radius:50%;background:rgba(45,212,191,.95);border:none;color:#04211f;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.oprev-dl button svg{width:22px;height:22px}
.oprev-ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--txt3)}
.oprev-ico svg{width:32px;height:32px}
.ocust{font-size:15px;font-weight:800;margin-bottom:2px;word-break:break-word;line-height:1.5}
.osub{font-size:11.5px;color:var(--txt2);margin-bottom:6px}
.oinfo{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--txt2);margin-bottom:4px}
.oinfo span{display:inline-flex;align-items:center;gap:4px}
.oinfo svg{width:13px;height:13px;color:var(--txt3);flex:none}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.st-chip{padding:7px 12px;border-radius:99px;background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt2);font-size:11.5px;font-weight:800;transition:.2s;cursor:pointer}
.st-chip:hover{background:var(--panel2);color:var(--txt)}
.st-chip.on{color:#04211f;background:var(--teal);border-color:var(--teal)}
.oacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.oacts .btn-gh{padding:6px 10px;font-size:11.5px;min-height:34px}
.oacts .btn-gh svg{width:14px;height:14px}
.pin-btn{width:34px;height:34px;padding:0;border-radius:50%;background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt3);display:grid;place-items:center;margin-right:auto}
.pin-btn.on{color:#fcd34d;background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.55)}
.pin-btn svg{width:15px;height:15px}
.empty{padding:46px 20px;text-align:center;color:var(--txt3)}
.empty svg{width:46px;height:46px;margin:0 auto 12px;opacity:.45}
.empty b{display:block;color:var(--txt2);font-size:15px;margin-bottom:4px}
.mcard{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.m-ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#04211f;background:linear-gradient(135deg,#5eead4,#0d9488);flex:none}
.m-info{min-width:110px}.m-info b{display:block;font-size:14.5px}
.m-info span{font-size:11.5px;color:var(--txt3);direction:ltr;display:inline-block}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-date{font-size:11px;color:var(--txt3)}
.m-acts{display:flex;gap:7px;margin-right:auto}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--stroke);background:var(--panel2);color:var(--txt2);display:grid;place-items:center;transition:.2s}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.14)}
.ibtn.danger:hover{background:rgba(225,29,72,.35);border-color:rgba(225,29,72,.5)}
.ibtn svg{width:17px;height:17px}
.overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:620px;max-height:93vh;overflow-y:auto;background:var(--bg);border:1px solid var(--stroke);border-bottom:none;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 60px rgba(0,0,0,.5);animation:sheetUp .38s both}
html.light .modal{background:#fff}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}}
@media(min-width:720px){.overlay{align-items:center;padding:24px}.modal{border-radius:24px;border-bottom:1px solid var(--stroke)}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

function jISO(jy,jm,jd){return jy+'/'+pad2(jm)+'/'+pad2(jd)}

function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function jOfDate(d){var j=toJalaali(d);return jISO(j.jy,j.jm,j.jd)}
function presetRange(p){
  var now=new Date(),t=todayJ(),tISO=jISO(t.jy,t.jm,t.jd);
  if(p==='today')return {from:tISO,to:tISO};
  if(p==='yesterday'){var s=jOfDate(addDays(now,-1));return {from:s,to:s}}
  if(p==='thisWeek')return {from:jOfDate(addDays(now,-pWeek(now))),to:tISO};
  if(p==='lastWeek')return {from:jOfDate(addDays(now,-pWeek(now)-7)),to:jOfDate(addDays(now,-pWeek(now)-1))};
  if(p==='thisMonth')return {from:jISO(t.jy,t.jm,1),to:tISO};
  if(p==='lastMonth'){var jy=t.jy,jm=t.jm-1;if(jm<1){jm=12;jy--}return {from:jISO(jy,jm,1),to:jISO(jy,jm,jalaliMonthLen(jy,jm))}}
  return null;
}
function chartRangeDays(code){
  var now=new Date();
  if(code==='1w')return {from:addDays(now,-7),to:now};
  if(code==='1m')return {from:addDays(now,-30),to:now};
  if(code==='3m')return {from:addDays(now,-90),to:now};
  if(code==='6m')return {from:addDays(now,-180),to:now};
  if(code==='1y')return {from:addDays(now,-365),to:now};
  return {from:addDays(now,-30),to:now};
}
function utf8ToB64(str){
  try{var bytes=new TextEncoder().encode(str),bin='',CH=0x8000,i;for(i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin)}
  catch(e){return btoa(unescape(encodeURIComponent(str)))}
}
function b64ToUtf8(b64){
  try{var bin=atob(b64),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new TextDecoder().decode(arr)}
  catch(e){return decodeURIComponent(escape(atob(b64)))}
}

function translateErr(e){
  if(!e)return 'خطای نامشخص';
  if(e.status===401)return 'توکن نامعتبر.';
  if(e.status===403)return 'دسترسی توکن کافی نیست.';
  if(e.status===404)return 'ریپازیتوری یا فایل پیدا نشد.';
  if(e.status===409)return 'تداخل همزمان.';
  if(e.status===422)return 'خطا در ذخیره.';
  if(e.status>=500)return 'خطای موقت.';
  return e.message||'خطای نامشخص';
}
function ghApi(path,opts,token){
  opts=opts||{};var isGet=!opts.method||opts.method==='GET';
  var headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'Content-Type':'application/json'};
  return fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:headers,body:opts.body||null,cache:isGet?'no-store':'no-cache'}).then(function(r){
    if(!r.ok)return r.text().then(function(t){var m='';try{m=JSON.parse(t).message}catch(e){}var e2=new Error(m||('HTTP '+r.status));e2.status=r.status;throw e2});
    if(r.status===204)return null;return r.json();
  });
}
function fetchFile(file){
  var c=ghCfg();var url='/repos/'+c.owner+'/'+c.repo+'/contents/'+file+'.json?ref='+encodeURIComponent(c.branch)+'&_t='+Date.now();
  return ghApi(url,{},c.token).then(function(j){var d;try{d=JSON.parse(b64ToUtf8((j.content||'').replace(/\s/g,'')))}catch(e){d={}}return {data:d,sha:j.sha||null}})
    .catch(function(e){if(e.status===404)return{data:{},sha:null};throw e});
}

}

function commitFile(file,applyFn,msg){
  var c=ghCfg();function attempt(n){
    return fetchFile(file).then(function(cur){var inner=cur.data[FILE_KEY[file]]||(file==='settings'?{}:[]);var ni=applyFn(JSON.parse(JSON.stringify(inner)));var full={rev:(cur.data.rev||0)+1};full[FILE_KEY[file]]=ni;var body={message:msg||('OWM: '+file),content:utf8ToB64(JSON.stringify(full,null,1)),branch:c.branch};if(cur.sha)body.sha=cur.sha;return ghApi('/repos/'+c.owner+'/'+c.repo+'/contents/'+file+'.json',{method:'PUT',body:JSON.stringify(body)},c.token)})
      .catch(function(e){if(n<4&&(e.status===409||e.status===422||e.status>=500))return attempt(n+1);throw e});
  }return attempt(0);
}

}
function hashPassword(pw){
  var s='owm::'+pw;function fb(){var h1=0xdeadbeef^7,h2=0x41c6ce57^7,i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
  return new Promise(function(r){try{if(window.crypto&&crypto.subtle&&TextEncoder){crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){var o='',y=new Uint8Array(b);for(var i=0;i<y.length;i++)o+=('0'+y[i].toString(16)).slice(-2);r(o)}).catch(function(){r(fb())});return}}catch(e){}r(fb())});
}

  else if(st==='rejected'||st==='returned_broken'||st==='cancelled')icon=I.x;
  else if(st==='return_requested')icon=I.alert;
  else if(st==='in_progress'||st==='need_production')icon=I.refresh;

  return '<span class="badge b-'+st+'">'+icon+' '+STATUS_FA[st]+'</span>';

  var t=todayJ(),todayISO=jISO(t.jy,t.jm,t.jd);

  function stats(os){
    return {
      total:os.length,
      done:os.filter(function(o){return o.status==='shipped'}).length,
      notdone:os.filter(function(o){return o.status!=='shipped'&&!o.cancelledAt}).length,

  }

  var rangeBtns=CHART_RANGES.map(function(r){return'<button class="chip '+(chartRange===r[0]?'on':'')+'" data-chart="'+r[0]+'">'+r[1]+'</button>'}).join('');

    '</div>'+
    '<div class="report-grid">'+
      '<div class="report-tile"><b>'+faNum(weekStats.total)+'</b><span>این هفته صادر</span></div>'+
      '<div class="report-tile"><b>'+faNum(weekStats.done)+'</b><span>این هفته ارسال</span></div>'+
      '<div class="report-tile"><b>'+faNum(monthStats.total)+'</b><span>این ماه صادر</span></div>'+
      '<div class="report-tile"><b>'+faNum(monthStats.done)+'</b><span>این ماه ارسال</span></div>'+
    '</div>'+

    (overdue.length?'<div class="sec-title">'+I.alert+' سفارش‌های عقب‌افتاده</div><div class="overdue-list">'+overdue.map(function(o){
      var days=Math.floor((Date.now()-o.ts)/(24*60*60*1000));
      return '<div class="overdue-row"><b>#'+faNum(o.orderNo)+'</b> · '+esc(o.title)+' · '+faNum(days)+' روز گذشته</div>';
    }).join('')+'</div>':'');
  page.querySelectorAll('[data-chart]').forEach(function(b){b.onclick=function(){chartRange=b.getAttribute('data-chart');renderReports();setTimeout(drawChart,50)}});
  setTimeout(drawChart,50);

function drawChart(){
  var canvas=document.getElementById('chartCanvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  var rng=chartRangeDays(chartRange);
  var days=Math.max(1,Math.ceil((rng.to-rng.from)/(24*60*60*1000))+1);
  var buckets=[];for(var i=0;i<days;i++)buckets.push(0);
  FILES.orders.data.forEach(function(o){
    if(o.deletedAt)return;
    var daysDiff=Math.floor((o.ts-rng.from.getTime())/(24*60*60*1000));
    if(daysDiff>=0&&daysDiff<days)buckets[daysDiff]++;
  });
  var maxV=1;buckets.forEach(function(v){if(v>maxV)maxV=v});
  var padL=30,padR=10,padT=10,padB=25;
  var cw=w-padL-padR,ch=h-padT-padB;
  /* grid */
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--stroke-soft').trim()||'rgba(255,255,255,.08)';
  ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=padT+ch*(i/4);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke()}
  /* line */
  ctx.strokeStyle='#2dd4bf';ctx.lineWidth=2.5;ctx.beginPath();
  buckets.forEach(function(v,idx){
    var x=padL+(cw/(days-1||1))*idx;
    var y=padT+ch-(ch*(v/maxV));
    if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  /* fill */
  ctx.lineTo(padL+cw,padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();
  var grd=ctx.createLinearGradient(0,padT,0,padT+ch);grd.addColorStop(0,'rgba(45,212,191,.35)');grd.addColorStop(1,'rgba(45,212,191,0)');
  ctx.fillStyle=grd;ctx.fill();
  /* dots */
  ctx.fillStyle='#2dd4bf';
  buckets.forEach(function(v,idx){
    var x=padL+(cw/(days-1||1))*idx;
    var y=padT+ch-(ch*(v/maxV));
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();
  });
  /* y labels */
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--txt3').trim()||'#93a29a';
  ctx.font='10px Vazirmatn';ctx.textAlign='right';
  for(var i=0;i<=4;i++){var y=padT+ch*(i/4);ctx.fillText(faNum(Math.round(maxV*(1-i/4))),padL-4,y+3)}
  /* date labels */
  var dateEl=document.getElementById('chartDates');if(!dateEl)return;
  var labels=[];var steps=Math.min(6,days);var step=Math.max(1,Math.floor(days/steps));
  for(var i=0;i<days;i+=step){
    var d=addDays(rng.from,i);
    var j=toJalaali(d);
    labels.push(fmtJDateShort(jISO(j.jy,j.jm,j.jd)));
  }
  dateEl.innerHTML=labels.map(function(l){return'<span>'+esc(l)+'</span>'}).join('');
}

/* === هشدار overdue برای officer === */
function checkOverdueOrders(){
  if(!session||session.role!=='officer')return;
  var now=Date.now();
  var overdue=FILES.orders.data.filter(function(o){
    if(o.status==='shipped'||o.cancelledAt||o.deletedAt)return false;
    if(o.status!=='approved'&&o.status!=='seen'&&o.status!=='in_progress'&&o.status!=='need_production')return false;
    return (now-o.ts)>OVERDUE_MS;
  });
  var shown=overdue.filter(function(o){var k=o.id,last=overdueAcknowledged[k]||0;return now-last>24*60*60*1000});
  if(!shown.length)return;
  var o=shown[0];
  var days=Math.floor((now-o.ts)/(24*60*60*1000));
  var m=openModal('<div class="m-head"><div class="m-title" style="color:#fcd34d">'+I.bell+' سفارش عقب‌افتاده!</div></div>'+
    '<p style="font-size:14px;color:var(--txt)"><b>#'+faNum(o.orderNo)+'</b> — «'+esc(o.title)+'»</p>'+
    '<p style="font-size:13px;color:#fda4af;margin-top:8px">این سفارش '+faNum(days)+' روز است که در وضعیت «'+STATUS_FA[o.status]+'» مانده!</p>'+
    '<p style="font-size:13px;color:var(--txt2);margin-top:10px">لطفاً تصمیم بگیرید:</p>'+
    '<div class="m-actions" style="flex-direction:column"><button class="btn btn-p" id="odAck">همین الان بررسی می‌کنم</button><button class="btn btn-gh" id="odPromise">قول می‌دهم تا فردا انجامش بدهم</button></div>',{static:true});
  m.md.querySelector('#odAck').onclick=function(){
    overdueAcknowledged[o.id]=now+365*24*60*60*1000;DB.set('overdue_ack',overdueAcknowledged);closeModal();
    goTo('orders');toast('بررسی می‌کنید…');
  };
  m.md.querySelector('#odPromise').onclick=function(){
    overdueAcknowledged[o.id]=now+24*60*60*1000;DB.set('overdue_ack',overdueAcknowledged);closeModal();
    toast('قول ثبت شد. فردا دوباره یادآوری می‌شود.','warn');
  };
}

function showView(name){$('#view-login').style.display=(name==='login')?'grid':'none';$('#view-app').style.display=(name==='app')?'block':'none'}
function renderNav(){
  var items=NAV_ITEMS[session.role]||NAV_ITEMS.sales;
  $('#bottomNav').innerHTML=items.map(function(x){return'<button class="bn-btn '+(curPage===x[0]?'on':'')+'" data-navpage="'+x[0]+'">'+I[x[2]]+'<span>'+x[1]+'</span></button>'}).join('');
  $('#sideNav').innerHTML=items.map(function(x){return'<button class="sn-btn '+(curPage===x[0]?'on':'')+'" data-navpage="'+x[0]+'">'+I[x[2]]+'<span>'+x[1]+'</span></button>'}).join('');
}
function renderPage(p){
  try{
    if(p==='dashboard')renderDashboard();
    else if(p==='orders'&&ordersView)ordersView.render();
    else if(p==='notdone'&&notDoneView)notDoneView.render();
    else if(p==='newOrder')renderNewOrder();
    else if(p==='members')renderMembers();
    else if(p==='reports')renderReports();
  }catch(e){if(window.console)console.error(e);var el=$('#page-'+p);if(el)el.innerHTML=pageErrorHTML(e)}
}
function goTo(p){
  if(!session){showView('login');return}
  if(PAGE_ACCESS[session.role].indexOf(p)===-1){toast('دسترسی مجاز نیست','error');return}
  curPage=p;
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
  var el=$('#page-'+p);if(el)el.classList.add('active');
  $('#pageTitle').textContent=PAGE_TITLE[p]||'';
  RENDER_ANIM=true;renderNav();renderPage(p);window.scrollTo(0,0);
}
function renderHeader(){
  $('#hdrName').textContent=session.name;
  $('#hdrRole').textContent=session.isRoot?'مدیر کل':ROLE_FA[session.role];
  $('#btnSettings').style.display=(session.role==='admin')?'grid':'none';
  $('#btnTheme').style.display='grid';
  $('#syncChip').onclick=function(){
    if(session.role==='admin')openSyncModal();
    else{toast(ghEnabled()?'اتصال برقرار است':'آفلاین');}
  };
}
function setSyncChip(){
  var c=$('#syncChip'),t=$('#syncTxt');if(!c)return;
  c.classList.remove('ok','off');
  if(ghEnabled()){c.classList.add('ok');t.textContent='متصل'}
  else{c.classList.add('off');t.textContent='آفلاین'}
}
function enterApp(){
  showView('app');renderHeader();setSyncChip();
  if(viewScope===null){var sd=FILES.settings.data||{};viewScope=(sd.salesDefaultScope==='all')?'all':'own'}
  if(!ordersView){var e1=$('#page-orders');if(e1)ordersView=makeOrdersView({mount:'#page-orders',mode:'normal',defaultPreset:'today'})}
  if(!notDoneView){var e2=$('#page-notdone');if(e2)notDoneView=makeOrdersView({mount:'#page-notdone',mode:'notdone',defaultPreset:'all'})}
  RENDER_ANIM=true;goTo('dashboard');
  setTimeout(checkOverdueOrders,2000);
  setInterval(checkOverdueOrders,5*60*1000);
}
function doLogout(){DB.del('session');session=null;closeAllModals();var lp=$('#loginPass');if(lp)lp.value='';showView('login')}

/* === تم شب/روز === */
function applyTheme(theme){
  if(theme==='light')document.documentElement.classList.add('light');
  else document.documentElement.classList.remove('light');
  localStorage.setItem('owm.theme',theme);
}
function toggleTheme(){
  var isLight=document.documentElement.classList.contains('light');
  applyTheme(isLight?'dark':'light');
}
function initTheme(){
  var saved=localStorage.getItem('owm.theme');
  if(!saved)saved=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  applyTheme(saved);
}

function startPoll(){
  function tick(){if(ghEnabled())refreshAll();setTimeout(tick,(ghCfg().pollSec||8)*1000)}
  setTimeout(tick,1500);
  setInterval(function(){if(session&&curPage!=='newOrder'){RENDER_ANIM=false;renderPage(curPage)}},60000);
}

document.addEventListener('click',function(e){
  var tg=e.target;if(!tg||!tg.closest)return;
  var pwd=tg.closest('[data-pwd]');if(pwd){var i=$('#'+pwd.getAttribute('data-pwd'));if(i){i.type=i.type==='password'?'text':'password'}return}
  var nav=tg.closest('[data-navpage]');if(nav){goTo(nav.getAttribute('data-navpage'));return}
  var b=tg.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  safe(function(){
    if(act==='detail'){openDetail(id);return}
    if(act==='viewpdf'){openPdfModal(id);return}
    if(act==='dlpdf'){downloadPdf(id);return}
    if(act==='print'){printOrder(id);return}
    if(act==='share'){shareOrder(id);return}
    if(act==='reject'){openRejectModal(id);return}
    if(act==='resubmit'){openResubmitModal(id);return}
    if(act==='return'){openReturnModal(id);return}
    if(act==='cancel'){openCancelModal(id);return}
    if(act==='markseen'){return markSeen(id).then(function(){renderPage(curPage)})}
    if(act==='setstatus'){var ns=b.getAttribute('data-status');return setOfficerStatus(id,ns).then(function(){RENDER_ANIM=false;renderPage(curPage)})}
    if(act==='pin'){return pinOrder(id).then(function(){RENDER_ANIM=false;renderPage(curPage)})}
    if(act==='delete'){var o=findOrder(id);if(!o)return;return confirmBox({title:'حذف سفارش',text:'#'+o.orderNo+' حذف شود؟',okText:'حذف',danger:true}).then(function(ok){if(ok)return delOrder(id).then(function(){renderPage(curPage)})})}
    if(act==='adduser'){openUserModal(null);return}
    if(act==='edituser'){openUserModal(findUserById(id));return}
    if(act==='approve'){var o=findOrder(id);if(!o)return;return confirmBox({title:'تأیید سفارش',text:'#'+o.orderNo+' تأیید شود؟',okText:'تأیید'}).then(function(ok){if(ok)return approveOrder(id).then(function(){closeAllModals();renderPage(curPage)})})}
    if(act==='toggleuser'){var u2=findUserById(id);if(!u2)return;var p=Promise.resolve(true);if(u2.active)p=confirmBox({title:'غیرفعال',text:'«'+u2.name+'» غیرفعال شود؟',okText:'بله',danger:true});return p.then(function(ok){if(!ok)return;return updUser(id,{name:u2.name,username:u2.username,active:!u2.active}).then(function(){renderPage(curPage)})})}
    if(act==='deluser'){var u2=findUserById(id);if(!u2)return;return confirmBox({title:'حذف کاربر',text:'«'+u2.name+'» حذف شود؟',okText:'حذف',danger:true}).then(function(ok){if(ok)return delUser(id).then(function(){if(session)renderPage(curPage)})})}
  });
});
document.addEventListener('click',function(e){
  var tg=e.target;if(!tg||!tg.closest)return;
  var btn=tg.closest('[data-returnok]');if(!btn)return;
  var c=btn.getAttribute('data-returnok');
  var md=btn.closest('.modal');if(!md)return;
  var tEl=md.querySelector('.m-title');if(!tEl)return;
  var m=tEl.textContent.match(/#(\d+)/);if(!m)return;
  var orderNo=m[1];var target=null;
  for(var i=0;i<FILES.orders.data.length;i++){if(FILES.orders.data[i].orderNo===orderNo&&FILES.orders.data[i].returnRequest&&FILES.orders.data[i].returnRequest.status==='pending'){target=FILES.orders.data[i];break}}
  if(!target){toast('یافت نشد','error');return}
  safe(function(){return approveReturn(target.id,c).then(function(){closeAllModals();renderPage(curPage)})});
});

$('#btnLogout').onclick=function(){safe(function(){return confirmBox({title:'خروج',text:'خارج می‌شوید؟',okText:'خروج',danger:true}).then(function(ok){if(ok)doLogout()})})};
$('#btnSettings').onclick=function(){safe(function(){openSettingsModal()})};
$('#btnTheme').onclick=toggleTheme;
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();var errEl=$('#loginErr'),btn=$('#loginBtn');errEl.textContent='';
  var un=$('#loginUser').value.trim(),pw=$('#loginPass').value;
  if(!un||!pw){errEl.textContent='نام کاربری و رمز را وارد کنید';return}
  btn.disabled=true;btn.textContent='در حال بررسی…';
  refreshFile('users').then(function(){
    var u=findUserByUsername(un);
    if(!u)throw new AppError('نام کاربری یا رمز نادرست');
    if(!u.active)throw new AppError('حساب غیرفعال است');
    return hashPassword(pw).then(function(h){
      if(h!==u.passHash)throw new AppError('نام کاربری یا رمز نادرست');
      session={userId:u.id,username:u.username,name:u.name,role:u.role,isRoot:!!u.isRoot,loginAt:Date.now()};
      DB.set('session',{userId:u.id,loginAt:session.loginAt});
      $('#loginPass').value='';btn.disabled=false;btn.textContent='ورود به سیستم';
      enterApp();toast('خوش آمدید، '+u.name);
    });
  }).catch(function(err){btn.disabled=false;btn.textContent='ورود به سیستم';errEl.textContent=(err&&err.message)?err.message:'خطا در ورود'});
});
var _tap=0,_tapT=null;
$('#logoTap').addEventListener('click',function(){
  _tap++;clearTimeout(_tapT);_tapT=setTimeout(function(){_tap=0},1600);
  if(_tap>=5){_tap=0;safe(function(){
    if(!session||session.role!=='admin')return;
    return confirmBox({title:'پاک‌سازی کش',text:'کش محلی پاک شود؟',okText:'پاک کن',danger:true}).then(function(ok){if(!ok)return;['cache_users','cache_orders','cache_settings','session'].forEach(function(k){DB.del(k)});location.reload()});
  })}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('storage',function(){RENDER_ANIM=false;autoRender()});
window.addEventListener('online',function(){setSyncChip();if(session&&ghEnabled())refreshAll()});
window.addEventListener('offline',function(){setSyncChip()});
window.addEventListener('resize',function(){if(curPage==='reports')setTimeout(drawChart,100)});

(function init(){
  initTheme();
  overdueAcknowledged=DB.get('overdue_ack',{})||{};
  ['users','orders','settings'].forEach(function(f){var c=DB.get('cache_'+f,null);if(c&&c.data!==undefined){FILES[f].rev=c.rev||0;FILES[f].data=c.data}});
  lastSig=dataSig();
  hashPassword(DEFAULT_ADMIN.password).then(function(h){rootHash=h;return ensureRootLocal()}).then(function(){
    setSyncChip();if(ghEnabled())return refreshAll().then(function(){return persistRootToRemote()});
  }).then(function(){
    startPoll();setSyncChip();
    var s=validateSession();
    if(s){session=s;enterApp()}else showView('login');
  }).catch(function(e){
    if(window.console)console.error(e);startPoll();setSyncChip();
    var s=validateSession();if(s){session=s;enterApp()}else showView('login');
  });
})();
