<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>OWM — سامانه مدیریت سفارش‌ها</title>
<style>
/* ===================== پایه ===================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --txt:#eef4fb; --txt2:rgba(228,238,248,.62); --txt3:rgba(228,238,248,.38);
  --stroke:rgba(255,255,255,.14); --stroke-soft:rgba(255,255,255,.08);
  --teal:#2dd4bf; --teal-soft:rgba(45,212,191,.14);
  --gold:#f6b73c; --sky:#5bc8f5;
  --green:#4ade80; --amber:#fbbf24; --red:#fb7185;
  --r:16px;
}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,Arial,sans-serif;background:#0b1220;color:var(--txt);min-height:100vh;line-height:1.8;font-size:14.5px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:9px}
:focus-visible{outline:2px solid rgba(45,212,191,.7);outline-offset:2px}

/* ===================== پس‌زمینه زنده ===================== */
.bg{position:fixed;top:0;bottom:0;left:0;right:0;z-index:-2;background:linear-gradient(155deg,#0a1120 0%,#0d1b2e 45%,#0a2330 100%);overflow:hidden}
.bg:after{content:"";position:absolute;top:0;bottom:0;left:0;right:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:26px 26px}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);display:block}
.b1{width:52vmax;height:52vmax;background:radial-gradient(circle,rgba(20,184,166,.42),transparent 62%);top:-16vmax;right:-12vmax;animation:fl1 26s ease-in-out infinite alternate}
.b2{width:44vmax;height:44vmax;background:radial-gradient(circle,rgba(246,183,60,.22),transparent 62%);bottom:-14vmax;left:-10vmax;animation:fl2 32s ease-in-out infinite alternate}
.b3{width:38vmax;height:38vmax;background:radial-gradient(circle,rgba(56,152,224,.28),transparent 62%);top:32%;left:28%;animation:fl3 38s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate(-6vmax,8vmax) scale(1.12)}}
@keyframes fl2{to{transform:translate(7vmax,-6vmax) scale(1.15)}}
@keyframes fl3{to{transform:translate(-8vmax,-5vmax) scale(.9)}}

/* ===================== شیشه ===================== */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:0 16px 40px rgba(2,8,23,.45),inset 0 1px 0 rgba(255,255,255,.13)}

/* ===================== ورود ===================== */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);padding:30px 24px;animation:rise .6s both}
.logo{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:8px}
.logo-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:1.5px;color:#032522;background:linear-gradient(135deg,#5eead4,#0d9488 70%);box-shadow:0 12px 30px rgba(45,212,191,.35),inset 0 1px 0 rgba(255,255,255,.5);transform:rotate(-4deg)}
.brand-name{font-size:38px;font-weight:900;line-height:1;letter-spacing:2px}
.brand-sub{color:var(--txt2);font-size:12.5px;margin-bottom:6px}
.auth-hint{background:var(--teal-soft);border:1px solid rgba(45,212,191,.35);color:#9ef0e2;border-radius:12px;padding:10px 14px;font-size:12.5px;margin:14px 0 4px;line-height:2}

/* ===================== فرم‌ها ===================== */
.frow{margin-top:14px}
.frow label{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:12px;padding:11px 14px;color:var(--txt);transition:.2s;min-height:48px;font-size:15px}
.inp::placeholder{color:var(--txt3)}
.inp:focus{outline:none;border-color:rgba(45,212,191,.7);box-shadow:0 0 0 4px rgba(45,212,191,.14);background:rgba(255,255,255,.09)}
select.inp option{background:#0e1a2b;color:var(--txt)}
textarea.inp{resize:vertical;min-height:90px}
.pwd{position:relative}
.pwd .inp{padding-left:52px}
.pwd button{position:absolute;top:5px;bottom:5px;left:6px;width:40px;border:none;background:none;color:var(--txt3);display:grid;place-items:center;border-radius:10px}
.pwd button:hover{color:var(--txt)}
.ferr{font-size:12.5px;margin-top:10px;text-align:center;min-height:20px;font-weight:700}
.ferr.on{color:var(--red);animation:shake .4s}
.fnote{font-size:11.5px;color:var(--txt3);margin-top:5px}
.dsel{display:flex;gap:8px}
.dsel select{flex:1;min-width:0;padding:11px 8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}

.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;margin-top:14px}
.switch-row>span:first-child{font-weight:700;font-size:13.5px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;top:0;left:0;right:0;bottom:0;z-index:2;margin:0;cursor:pointer}
.switch i{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.12);border:1px solid var(--stroke);border-radius:99px;transition:.25s}
.switch i:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#cbd5e1;top:3px;right:3px;transition:.25s}
.switch input:checked+i{background:rgba(45,212,191,.35);border-color:rgba(45,212,191,.6)}
.switch input:checked+i:after{right:26px;background:var(--teal)}
.switch input:disabled+i{opacity:.4}

.filebox{display:block;border:1.5px dashed rgba(255,255,255,.28);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.03)}
.filebox:hover{border-color:var(--teal);background:var(--teal-soft)}
.filebox svg{margin:0 auto 8px;color:var(--teal)}
.filebox b{display:block;font-size:14px}
.filebox small{color:var(--txt3);font-size:11.5px}
.filebox .fmeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.filebox.has{border-style:solid;border-color:rgba(45,212,191,.55);background:var(--teal-soft)}

/* ===================== دکمه‌ها ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;transition:.2s;min-height:48px;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(135deg,#2dd4bf,#0e9f9a);color:#04211f;box-shadow:0 8px 22px rgba(45,212,191,.28)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ok{background:linear-gradient(135deg,#4ade80,#16a34a);color:#05240f;box-shadow:0 8px 20px rgba(74,222,128,.25)}
.btn-ok:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-dng{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.3)}
.btn-dng:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-gh{background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--txt)}
.btn-gh:hover{background:rgba(255,255,255,.13)}
.btn-blk{width:100%}
.btn-sm{min-height:40px;padding:7px 13px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-sm svg{width:15px;height:15px}
.btn:disabled{opacity:.45;pointer-events:none}

/* ===================== بج‌ها ===================== */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-pending{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}
.b-approved{color:#86efac;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.b-rejected{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
.b-sample{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.42)}
.b-ver{color:var(--txt2);background:rgba(255,255,255,.07);border-color:var(--stroke)}
.b-lock{color:var(--txt3);background:transparent;border-color:transparent}
.r-admin{color:#ffd98a;background:rgba(246,183,60,.13);border-color:rgba(246,183,60,.4)}
.r-accountant{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.4)}
.r-sales{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.r-active{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
.r-inactive{color:var(--txt3);background:rgba(255,255,255,.05);border-color:var(--stroke)}

/* ===================== برنامه ===================== */
#view-app{display:none;min-height:100vh}
.topbar{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:10px;margin:10px 12px 0;padding:9px 14px}
.tb-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:10.5px;letter-spacing:1px;color:#032522;background:linear-gradient(135deg,#5eead4,#0d9488);box-shadow:0 6px 16px rgba(45,212,191,.3);flex:none;user-select:none;cursor:pointer}
.tb-title{font-size:16.5px;font-weight:900;line-height:1.2}
.tb-user{margin-right:auto;text-align:right;line-height:1.4;min-width:0}
.tb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.tb-user span{font-size:10.5px;color:var(--txt2)}
.tb-out{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--txt2);display:grid;place-items:center;transition:.2s}
.tb-out:hover{color:#fff;background:rgba(225,29,72,.35);border-color:rgba(225,29,72,.5)}

main{padding:16px 14px 120px;max-width:1100px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

.sidenav{display:none}
@media(min-width:920px){
  .bottomnav{display:none!important}
  .sidenav{display:flex;flex-direction:column;gap:6px;position:fixed;top:82px;right:18px;width:216px;padding:12px;z-index:30}
  main{margin-right:250px;padding-bottom:40px}
  .topbar{margin:12px 18px 0}
}
.bn-btn,.sn-btn{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--txt3);font-weight:800;font-size:12px;border-radius:14px;transition:.22s}
.bn-btn{flex-direction:column;gap:3px;padding:7px 16px;font-size:11px}
.bn-btn svg,.sn-btn svg{width:22px;height:22px}
.sn-btn{padding:11px 14px;font-size:13.5px;width:100%;text-align:right}
.bn-btn.on,.sn-btn.on{color:#7ff5e6;background:var(--teal-soft);box-shadow:inset 0 0 0 1px rgba(45,212,191,.35)}
.bottomnav{position:fixed;bottom:10px;left:10px;right:10px;z-index:40;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}

/* ===================== داشبورد ===================== */
.welcome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;margin-bottom:16px}
.welcome h2{font-size:19px;font-weight:900}
.welcome p{font-size:12.5px;color:var(--txt2)}
.welcome .btn{margin-right:auto}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
@media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;gap:12px;align-items:center;padding:15px 16px;transition:.25s}
.stat:hover{transform:translateY(-2px)}
.s-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.s-ic svg{width:22px;height:22px}
.s-num{font-size:23px;font-weight:900;line-height:1.3}
.s-lbl{font-size:11.5px;color:var(--txt2)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.subhead h3{font-size:15.5px;font-weight:900;display:flex;align-items:center;gap:8px}
.subhead h3 svg{width:18px;height:18px;color:var(--teal)}
.subhead button{border:none;background:none;color:#7ff5e6;font-size:12.5px;font-weight:800}

/* ===================== کارت سفارش ===================== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 1px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--txt2);font-size:12.5px;font-weight:700;transition:.2s;min-height:40px}
.chip:hover{color:var(--txt)}
.chip.on{background:linear-gradient(135deg,rgba(45,212,191,.28),rgba(45,212,191,.08));color:#7ff5e6;border-color:rgba(45,212,191,.55)}
.custom-range{margin-top:12px;padding:14px;display:grid;gap:10px}
.custom-range .cr-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.custom-range .cr-row>span{font-size:12.5px;font-weight:800;color:var(--txt2)}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:13px;padding:0 14px;min-height:48px;margin-top:12px;transition:.2s}
.search:focus-within{border-color:rgba(45,212,191,.6)}
.search svg{color:var(--txt3);flex:none;width:18px;height:18px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);min-height:46px;font-size:14px}
.ocount{font-size:12px;color:var(--txt3);margin:12px 2px 8px}
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{padding:16px;transition:.25s;animation:rise .4s both}
.ocard:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.26)}
.ocard-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.ono{font-weight:900;font-size:14px;background:rgba(255,255,255,.08);padding:3px 12px;border-radius:10px;border:1px solid var(--stroke)}
.ocust{font-size:16.5px;font-weight:800;margin-bottom:10px}
.oinfo{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;color:var(--txt2);margin-bottom:13px}
@media(min-width:640px){.oinfo{grid-template-columns:repeat(4,1fr)}}
.oinfo span{display:inline-flex;align-items:center;gap:6px}
.oinfo svg{width:15px;height:15px;color:var(--txt3);flex:none}
.oacts{display:flex;gap:8px;flex-wrap:wrap}

.empty{padding:46px 20px;text-align:center;color:var(--txt3)}
.empty svg{width:46px;height:46px;margin:0 auto 12px;opacity:.45}
.empty b{display:block;color:var(--txt2);font-size:15px;margin-bottom:4px}

/* ===================== اعضا ===================== */
.mcard{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;animation:rise .4s both}
.m-ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#04211f;background:linear-gradient(135deg,#5eead4,#0d9488);flex:none}
.m-info{min-width:110px}
.m-info b{display:block;font-size:14.5px}
.m-info span{font-size:11.5px;color:var(--txt3);direction:ltr;display:inline-block}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-date{font-size:11px;color:var(--txt3)}
.m-acts{display:flex;gap:7px;margin-right:auto}
.ibtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--txt2);display:grid;place-items:center;transition:.2s}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.14)}
.ibtn.danger:hover{background:rgba(225,29,72,.35);border-color:rgba(225,29,72,.5)}
.ibtn svg{width:17px;height:17px}

/* ===================== مودال ===================== */
.overlay{position:fixed;top:0;bottom:0;left:0;right:0;z-index:60;background:rgba(4,10,20,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:620px;max-height:93vh;overflow-y:auto;background:linear-gradient(180deg,rgba(24,36,56,.92),rgba(15,25,42,.94));-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--stroke);border-bottom:none;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);animation:sheetUp .38s both}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}}
@media(min-width:720px){
  .overlay{align-items:center;padding:24px}
  .modal{border-radius:24px;border-bottom:1px solid var(--stroke)}
}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.m-title{font-size:16.5px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-title svg{width:19px;height:19px;color:var(--teal)}
.m-x{width:38px;height:38px;flex:none;border-radius:11px;border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--txt2);font-size:15px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--stroke-soft);font-size:13.5px}
.drow span{color:var(--txt2);flex:none}
.drow b{font-weight:800;text-align:right}
.rbox{border-radius:13px;padding:13px 15px;margin-top:14px;font-size:13px;border:1px solid;line-height:2}
.rbox svg{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:4px}
.rbox.ok{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3)}
.rbox.bad{background:rgba(244,63,94,.09);border-color:rgba(244,63,94,.35)}
.rbox b{display:inline-block;min-width:104px;color:var(--txt2);font-weight:700}
.rbox .reason{background:rgba(0,0,0,.22);border-radius:9px;padding:8px 12px;margin-top:6px}
.locknote{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--txt2);background:rgba(255,255,255,.05);border:1px dashed var(--stroke);border-radius:11px;padding:9px 13px;line-height:1.9}
.locknote svg{width:16px;height:16px;flex:none;color:var(--gold)}
.ver-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ver-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:12px;padding:9px 13px;font-size:13px}
.ver-row.cur{border-color:rgba(45,212,191,.55);background:var(--teal-soft)}
.m-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.m-actions .btn{flex:1;min-width:118px}
.sec-title{font-size:13px;font-weight:900;color:var(--txt2);margin:20px 0 4px;display:flex;align-items:center;gap:8px}
.sec-title svg{width:15px;height:15px}
.sec-title:after{content:"";flex:1;height:1px;background:var(--stroke-soft)}
.pdf-prev{width:100%;height:60vh;border:none;border-radius:13px;background:#fff;margin-top:10px}

.tline{position:relative;padding-right:20px;margin-top:10px}
.tline:before{content:"";position:absolute;right:6px;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.12);border-radius:2px}
.tl-item{position:relative;padding:7px 0}
.tl-item:before{content:"";position:absolute;right:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.18)}
.tl-item.c-approved:before{background:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.tl-item.c-rejected:before{background:var(--red);box-shadow:0 0 0 3px rgba(251,113,133,.18)}
.tl-item.c-resubmitted:before{background:var(--gold);box-shadow:0 0 0 3px rgba(246,183,60,.18)}
.tl-item b{display:block;font-size:13px}
.tl-item span{font-size:11.5px;color:var(--txt3)}

/* ===================== توست ===================== */
#toastRoot{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100vw - 24px))}
@media(min-width:920px){#toastRoot{bottom:26px}}

/* ============================================================

/* ---------- آیکون‌ها ---------- */

/* ---------- ابزار عمومی ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad2(n){n=String(n);return n.length<2?'0'+n:n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function faNum(n){return Number(n).toLocaleString('fa-IR')}
function faDigits(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
function parseAmount(v){return Number(String(faDigits(v==null?'':v)).replace(/[,،\s]/g,''))}
function displayNo(no){return /^\d+$/.test(no)?faNum(no):no}
function fmtTimeFa(t){var p=String(t).split(':');return faNum(p[0])+':'+faNum(p[1])}
function fmtJDateFa(jd){var p=jd.split('/');return faNum(+p[2])+' '+MONTHS_FA[+p[1]-1]+' '+faNum(+p[0])}
function fmtTsFull(ts){var d=new Date(ts),j=toJalaali(d);return faNum(j.jd)+' '+MONTHS_FA[j.jm-1]+' '+faNum(j.jy)+' · '+faNum(d.getHours())+':'+faNum(pad2(d.getMinutes()))}

/* ============================================================
   تاریخ جلالی — بدون وابستگی خارجی
============================================================ */
function _div(a,b){return ~~(a/b)} function _mod(a,b){return a-~~(a/b)*b}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm, jump, leap, leapG, march, n, i;
  for(i=1;i<bl;i+=1){ jm=breaks[i]; jump=jm-jp; if(jy<jm)break;
    leapJ=leapJ+_div(jump,33)*8+_div(_mod(jump,33),4); jp=jm; }
  n=jy-jm;
  leapJ=leapJ+_div(n,33)*8+_div(_mod(n,33)+3,4);
  if(_mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=_div(gy,4)-_div((_div(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+_div(jump+4,33)*33;
  leap=_mod(_mod(n+1,33)-1,4); if(leap===-1)leap=4;
  return {leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=_div((gy+_div(gm-8,6)+100100)*1461,4)+_div(153*_mod(gm+9,12)+2,5)+gd-34840408;
  d=d-_div(_div(gy+100100+_div(gm-8,6),100)*3,4)+752; return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+_div(_div(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=_div(_mod(j,1461),4)*5+308;
  var gd=_div(_mod(i,153),5)+1, gm=_mod(_div(i,153),12)+1, gy=_div(j,1461)-100100+_div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-_div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){
  var gy=d2g(jdn).gy, jy=gy-621, r=jalCal(jy), jdn1f=g2d(gy,3,r.march), k=jdn-jdn1f, jd, jm;
  if(k>=0){ if(k<=185){ jm=1+_div(k,31); jd=_mod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; } k-=186; }
  else { jy-=1; k+=179; if(r.leap===1)k+=1; }
  jm=7+_div(k,30); jd=_mod(k,30)+1; return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(date){return d2j(g2d(date.getFullYear(),date.getMonth()+1,date.getDate()))}
function toGregorian(jy,jm,jd){return d2g(j2d(jy,jm,jd))}
function isLeapJY(jy){return jalCal(jy).leap===0}
function jalaliMonthLen(jy,jm){ if(jm<=6)return 31; if(jm<=11)return 30; return isLeapJY(jy)?30:29; }
function todayJ(){return toJalaali(new Date())}
function jISO(jy,jm,jd){return jy+'/'+pad2(jm)+'/'+pad2(jd)}
function pWeek(d){return (d.getDay()+1)%7}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function jOfDate(d){var j=toJalaali(d);return jISO(j.jy,j.jm,j.jd)}

function presetRange(p){
  var now=new Date(), t=todayJ(), tISO=jISO(t.jy,t.jm,t.jd), s, jy, jm;
  if(p==='today') return {from:tISO,to:tISO};
  if(p==='yesterday'){ s=jOfDate(addDays(now,-1)); return {from:s,to:s}; }
  if(p==='thisWeek') return {from:jOfDate(addDays(now,-pWeek(now))),to:tISO};
  if(p==='lastWeek') return {from:jOfDate(addDays(now,-pWeek(now)-7)),to:jOfDate(addDays(now,-pWeek(now)-1))};
  if(p==='thisMonth') return {from:jISO(t.jy,t.jm,1),to:tISO};
  if(p==='lastMonth'){ jy=t.jy; jm=t.jm-1; if(jm<1){jm=12;jy--;} return {from:jISO(jy,jm,1),to:jISO(jy,jm,jalaliMonthLen(jy,jm))}; }
  return null;
}

/* ============================================================
   Storage — لایه جدا؛ آماده برای Backend
============================================================ */
var DB={
  get:function(k,f){try{var v=localStorage.getItem('owm.'+k);return v?JSON.parse(v):f}catch(e){return f}},
  set:function(k,v){try{localStorage.setItem('owm.'+k,JSON.stringify(v));return true}
    catch(e){toast('حافظه مرورگر پر شده است؛ برخی فایل‌های PDF قدیمی را حذف کنید','error');return false}},
  del:function(k){try{localStorage.removeItem('owm.'+k)}catch(e){}},
  clearAll:function(){var self=this;['users','orders','session','settings'].forEach(function(k){self.del(k)})}
};
function getUsers(){return DB.get('users',[])}   function saveUsers(u){return DB.set('users',u)}
function getOrders(){return DB.get('orders',[])} function saveOrders(o){return DB.set('orders',o)}
function getSession(){return DB.get('session',null)} function saveSession(s){return DB.set('session',s)}
function ensureSettings(){ if(!DB.get('settings',null)) DB.set('settings',{version:'1.2.0',createdAt:Date.now()}); }

/* ============================================================
   Authentication + حساب پیش‌فرض مدیر کل
============================================================ */
var session=null;
function hashPassword(pw){
  var s='owm::'+pw;
  function fallback(){
    var h1=0xdeadbeef^7,h2=0x41c6ce57^7,i,ch;
    for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
    h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
    h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
    return (4294967296*(2097151&h2)+(h1>>>0)).toString(16);
  }
  return new Promise(function(resolve){
    try{
      if(window.crypto&&crypto.subtle&&window.TextEncoder){
        crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(buf){
          var out='',bytes=new Uint8Array(buf);
          for(var i=0;i<bytes.length;i++) out+=('0'+bytes[i].toString(16)).slice(-2);
          resolve(out);
        }).catch(function(){resolve(fallback())});
        return;
      }
    }catch(e){}
    resolve(fallback());
  });
}
function ensureDefaultAdmin(){
  var users=getUsers();
  var hasRoot=false;
  for(var i=0;i<users.length;i++) if(users[i].isRoot) hasRoot=true;
  if(hasRoot) return Promise.resolve();
  return hashPassword(DEFAULT_ADMIN.password).then(function(h){
    users=getUsers();
    users.push({id:uid(),name:DEFAULT_ADMIN.name,username:DEFAULT_ADMIN.username,passHash:h,role:'admin',active:true,isRoot:true,createdAt:Date.now()});
    saveUsers(users);
  });
}
function validateSession(){
  var s=getSession(); if(!s||!s.userId) return null;
  var users=getUsers(), u=null;
  for(var i=0;i<users.length;i++) if(users[i].id===s.userId){u=users[i];break;}
  if(!u||!u.active) return null;
  return {userId:u.id,username:u.username,name:u.name,role:u.role,isRoot:!!u.isRoot,loginAt:s.loginAt};
}

/* ============================================================
   Authorization (RBAC)
============================================================ */
function requireAuth(){ if(!session) throw new AppError('نشست شما معتبر نیست؛ لطفاً دوباره وارد شوید'); return session; }
function requireRole(roles){ var u=requireAuth(); if(roles.indexOf(u.role)===-1) throw new AppError('دسترسی شما به این عملیات مجاز نیست'); return u; }
function safe(fn){ return Promise.resolve().then(fn).catch(function(e){
  if(e instanceof AppError) toast(e.message,'error');
  else { if(window.console)console.error(e); toast('خطای غیرمنتظره‌ای رخ داد','error'); }
});}

/* ============================================================
   Users — فقط مدیر
============================================================ */
function addUser(d){
  requireRole(['admin']);
  var name=(d.name||'').trim(), username=(d.username||'').trim();
  if(!name) throw new AppError('نام کاربر را وارد کنید');
  if(!username) throw new AppError('نام کاربری را وارد کنید');
  if(!d.password) throw new AppError('رمز عبور را وارد کنید');
  if(!ROLE_FA[d.role]) throw new AppError('نقش انتخاب‌شده معتبر نیست');
  var users=getUsers();
  for(var i=0;i<users.length;i++) if(users[i].username.toLowerCase()===username.toLowerCase()) throw new AppError('این نام کاربری قبلاً ثبت شده است');
  return hashPassword(d.password).then(function(h){
    var us=getUsers();
    us.push({id:uid(),name:name,username:username,passHash:h,role:d.role,active:true,isRoot:false,createdAt:Date.now()});
    saveUsers(us); toast('کاربر ایجاد شد');
  });
}
function updateUser(id,d){
  requireRole(['admin']);
  var users=getUsers(), u=null, i;
  for(i=0;i<users.length;i++) if(users[i].id===id){u=users[i];break;}
  if(!u) throw new AppError('کاربر یافت نشد');
  var name=(d.name||'').trim(), username=(d.username||'').trim();
  if(!name) throw new AppError('نام کاربر را وارد کنید');
  if(!username) throw new AppError('نام کاربری را وارد کنید');
  if(u.isRoot){
    if(d.role&&d.role!=='admin') throw new AppError('نقش مدیر کل قابل تغییر نیست');
    if(username!==u.username) throw new AppError('نام کاربری مدیر کل قابل تغییر نیست');
    if(d.active===false) throw new AppError('مدیر کل قابل غیرفعال کردن نیست');
  }
  for(i=0;i<users.length;i++) if(users[i].id!==id&&users[i].username.toLowerCase()===username.toLowerCase()) throw new AppError('این نام کاربری قبلاً ثبت شده است');
  if(d.role) u.role=d.role;
  u.name=name; u.username=username;
  if(d.active!==undefined) u.active=d.active;
  var done=Promise.resolve();
  if(d.password) done=hashPassword(d.password).then(function(h){u.passHash=h});
  return done.then(function(){ saveUsers(users); toast('تغییرات ذخیره شد'); });
}
function deleteUser(id){
  requireRole(['admin']);
  var users=getUsers(), u=null, rest=[], i;
  for(i=0;i<users.length;i++){ if(users[i].id===id) u=users[i]; else rest.push(users[i]); }
  if(!u) throw new AppError('کاربر یافت نشد');
  if(u.isRoot) throw new AppError('مدیر کل قابل حذف نیست');
  saveUsers(rest); toast('کاربر حذف شد');
  if(session&&session.userId===id) doLogout();
}

/* ============================================================
   Orders + Versions + History
============================================================ */
function ev(type,text,u){ return {type:type,text:text,user:u.username,userName:u.name,ts:Date.now()}; }
function parseJDate(jy,jm,jd){
  jy=+jy; jm=+jm; jd=+jd;
  if(!jy||!jm||!jd||jm<1||jm>12) throw new AppError('تاریخ نامعتبر است');
  if(jd<1||jd>jalaliMonthLen(jy,jm)) throw new AppError('تاریخ نامعتبر است (روز خارج از محدوده ماه)');
  var g=toGregorian(jy,jm,jd);
  return {jy:jy,jm:jm,jd:jd,gISO:g.gy+'-'+pad2(g.gm)+'-'+pad2(g.gd),jISOv:jISO(jy,jm,jd),g:g};
}
function readPdf(file){
  if(!file) return Promise.reject(new AppError('فایل PDF انتخاب نشده است'));
  var ok=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(!ok) return Promise.reject(new AppError('فایل انتخابی PDF نیست'));
  if(file.size>MAX_PDF) return Promise.reject(new AppError('حجم فایل بیشتر از حد مجاز (۱٫۵ مگابایت) است'));
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){res({name:file.name,size:file.size,type:'application/pdf',dataUrl:r.result})};
    r.onerror=function(){rej(new AppError('خواندن فایل ناموفق بود'))};
    r.readAsDataURL(file);
  });
}
function suggestNo(){
  var mx=0,has=false,os=getOrders(),n;
  for(var i=0;i<os.length;i++){n=parseInt(os[i].orderNo,10);if(Number.isFinite(n)){if(n>mx)mx=n;has=true;}}
  return String(has?mx+1:1001);
}
function createOrder(d){
  var u=requireRole(['sales']);
  var orderNo=String(d.orderNo||'').trim();
  if(!orderNo) throw new AppError('شماره سفارش را وارد کنید');
  var os=getOrders(), i;
  for(i=0;i<os.length;i++) if(os[i].orderNo===orderNo) throw new AppError('شماره سفارش تکراری است');
  var customer=(d.customer||'').trim();
  if(!customer) throw new AppError('نام مشتری را وارد کنید');
  var amount=parseAmount(d.amount);
  if(!Number.isFinite(amount)||amount<=0) throw new AppError('مبلغ معتبر وارد کنید');
  if(!d.file) throw new AppError('فایل PDF انتخاب نشده است');
  var dd=parseJDate(d.jy,d.jm,d.jd);
  var now=new Date(), time=pad2(now.getHours())+':'+pad2(now.getMinutes());
  var ts=new Date(dd.g.gy,dd.g.gm-1,dd.g.gd,now.getHours(),now.getMinutes()).getTime();
  var order={id:uid(),orderNo:orderNo,version:1,baseId:null,prevId:null,customer:customer,amount:amount,desc:(d.desc||'').trim(),
    isSample:!!d.isSample,dateISO:dd.gISO,jdate:dd.jISOv,time:time,ts:ts,
    createdBy:u.username,creatorName:u.name,status:'pending',file:d.file,review:null,createdAt:Date.now(),history:[]};
  order.baseId=order.id;
  order.history.push(ev('created','سفارش ایجاد و برای بررسی ارسال شد',u));
  os.push(order); saveOrders(os);
  toast('سفارش ثبت شد'); return order;
}
function findOrderIdx(orders,id){for(var i=0;i<orders.length;i++)if(orders[i].id===id)return i;return -1}
function approveOrder(id){
  var u=requireRole(['accountant']);
  var orders=getOrders(), i=findOrderIdx(orders,id);
  if(i===-1) throw new AppError('سفارش یافت نشد');
  var o=orders[i];
  if(o.status!=='pending') throw new AppError('این سفارش قبلاً بررسی شده است');
  var now=new Date(), t=todayJ();
  o.status='approved';
  o.review={by:u.username,byName:u.name,ts:Date.now(),time:pad2(now.getHours())+':'+pad2(now.getMinutes()),jdate:jISO(t.jy,t.jm,t.jd),reason:null};
  o.history.push(ev('approved','سفارش تأیید شد',u));
  saveOrders(orders); toast('سفارش تأیید شد');
}
function rejectOrder(id,reason){
  var u=requireRole(['accountant']);
  reason=(reason||'').trim();
  if(!reason) throw new AppError('دلیل رد سفارش الزامی است');
  var orders=getOrders(), i=findOrderIdx(orders,id);
  if(i===-1) throw new AppError('سفارش یافت نشد');
  var o=orders[i];
  if(o.status!=='pending') throw new AppError('این سفارش قبلاً بررسی شده است');
  var now=new Date(), t=todayJ();
  o.status='rejected';
  o.review={by:u.username,byName:u.name,ts:Date.now(),time:pad2(now.getHours())+':'+pad2(now.getMinutes()),jdate:jISO(t.jy,t.jm,t.jd),reason:reason};
  o.history.push(ev('rejected','سفارش رد شد و دلیل رد ثبت شد',u));
  saveOrders(orders); toast('سفارش رد شد');
}
function resubmitOrder(id,d){
  var u=requireRole(['sales']);
  var orders=getOrders(), i=findOrderIdx(orders,id);
  if(i===-1) throw new AppError('سفارش یافت نشد');
  var o=orders[i];
  if(o.createdBy!==u.username) throw new AppError('فقط ثبت‌کننده سفارش می‌تواند نسخه جدید ارسال کند');
  if(o.status!=='rejected') throw new AppError('فقط سفارش رد شده قابل ارسال مجدد است');
  var customer=(d.customer||'').trim();
  if(!customer) throw new AppError('نام مشتری را وارد کنید');
  var amount=parseAmount(d.amount);
  if(!Number.isFinite(amount)||amount<=0) throw new AppError('مبلغ معتبر وارد کنید');
  var dd=parseJDate(d.jy,d.jm,d.jd);
  var file=d.file||o.file;
  if(!file) throw new AppError('فایل PDF برای نسخه جدید انتخاب نشده است');
  var maxV=0,j;
  for(j=0;j<orders.length;j++) if(orders[j].baseId===o.baseId&&orders[j].version>maxV) maxV=orders[j].version;
  var version=maxV+1;
  var now=new Date(), time=pad2(now.getHours())+':'+pad2(now.getMinutes());
  var ts=new Date(dd.g.gy,dd.g.gm-1,dd.g.gd,now.getHours(),now.getMinutes()).getTime();
  var nv={id:uid(),orderNo:o.orderNo,version:version,baseId:o.baseId,prevId:o.id,customer:customer,amount:amount,desc:(d.desc||'').trim(),
    isSample:!!d.isSample,dateISO:dd.gISO,jdate:dd.jISOv,time:time,ts:ts,
    createdBy:u.username,creatorName:u.name,status:'pending',file:file,review:null,createdAt:Date.now(),history:[]};
  nv.history.push(ev('created','نسخه '+version+' ایجاد و برای بررسی ارسال شد',u));
  o.history.push(ev('resubmitted','نسخه جدید (نسخه '+version+') توسط ثبت‌کننده ارسال شد',u));
  orders.push(nv); saveOrders(orders);
  toast('نسخه جدید سفارش ارسال شد'); return nv;
}
function groupVersions(o){
  return getOrders().filter(function(x){return x.baseId===o.baseId}).sort(function(a,b){return a.version-b.version});
}
function findOrder(id){var i=findOrderIdx(getOrders(),id);return i===-1?null:getOrders()[i]}

/* ============================================================
   Toast
============================================================ */
function toast(msg,type){
  type=type||'ok';
  var el=document.createElement('div'); el.className='toast '+type;
  el.innerHTML=(type==='error'?I.alert:I.check)+'<span>'+esc(msg)+'</span>';
  $('#toastRoot').appendChild(el);
  setTimeout(function(){el.classList.add('out');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},320)},3400);
}

/* ============================================================
   Modals
============================================================ */
function openModal(html,opts){
  opts=opts||{};
  var root=$('#modalRoot');
  var ov=document.createElement('div'); ov.className='overlay';
  var md=document.createElement('div'); md.className='modal glass';
  md.style.maxWidth=(opts.wide?700:560)+'px'; md.innerHTML=html;
  ov.appendChild(md); root.appendChild(ov); document.body.classList.add('modal-open');
  if(!opts.static) ov.addEventListener('click',function(e){if(e.target===ov)closeModal()});
  var cls=md.querySelectorAll('[data-close]');
  for(var i=0;i<cls.length;i++) cls[i].addEventListener('click',closeModal);
  return {ov:ov,md:md};
}
function closeModal(){
  var root=$('#modalRoot'); var last=root.lastElementChild;
  if(last&&last.parentNode) last.parentNode.removeChild(last);
  if(!root.children.length) document.body.classList.remove('modal-open');
}
function closeAllModals(){ $('#modalRoot').innerHTML=''; document.body.classList.remove('modal-open'); }
function confirmBox(o){
  return new Promise(function(res){
    var m=openModal(
      '<div class="m-head"><div class="m-title">'+esc(o.title)+'</div><button class="m-x" data-close>✕</button></div>'+
      '<p style="color:var(--txt2);font-size:13.5px">'+esc(o.text)+'</p>'+
      '<div class="m-actions"><button class="btn '+(o.danger?'btn-dng':'btn-ok')+'" id="cfOk">'+esc(o.okText||'تأیید')+'</button>'+
      '<button class="btn btn-gh" id="cfNo">انصراف</button></div>');
    m.md.querySelector('#cfOk').addEventListener('click',function(){closeModal();res(true)});
    m.md.querySelector('#cfNo').addEventListener('click',function(){closeModal();res(false)});
  });
}

/* ============================================================
   PDF — مشاهده / دانلود
============================================================ */
function dataUrlToBlob(du){
  var parts=du.split(','), h=parts[0], d=parts[1];
  var m=h.match(/:(.*?);/), mime=m?m[1]:'application/pdf';
  var bin=atob(d), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function openPdfModal(id){
  var o=findOrder(id);
  if(!o||!o.file) throw new AppError('فایلی برای این سفارش ثبت نشده است');
  var url=URL.createObjectURL(dataUrlToBlob(o.file.dataUrl));
  var m=openModal(
    '<div class="m-head"><div class="m-title">'+I.file+' پیش‌نمایش PDF</div><button class="m-x" data-close>✕</button></div>'+
    '<div style="font-size:12.5px;color:var(--txt2)">'+esc(o.file.name)+' · '+faNum(Math.round(o.file.size/1024))+' کیلوبایت</div>'+
    '<iframe class="pdf-prev" src="'+url+'" title="پیش‌نمایش PDF"></iframe>'+
    '<div class="fnote" style="text-align:center;margin-top:8px">اگر پیش‌نمایش نمایش داده نشد، از دکمه دانلود استفاده کنید.</div>'+
    '<div class="m-actions"><button class="btn btn-p" id="pdfDl">'+I.download+' دانلود فایل</button>'+
    '<button class="btn btn-gh" id="pdfTab">'+I.eye+' باز کردن در تب جدید</button></div>',{wide:true});
  m.md.addEventListener('click',function(e){
    if(e.target.closest('#pdfDl')) safe(function(){downloadPdf(id)});
    if(e.target.closest('#pdfTab')) window.open(url,'_blank');
  });
}
function downloadPdf(id){
  var o=findOrder(id);
  if(!o||!o.file) throw new AppError('فایلی برای این سفارش ثبت نشده است');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(dataUrlToBlob(o.file.dataUrl));
  a.download=o.file.name; document.body.appendChild(a); a.click(); if(a.parentNode)a.parentNode.removeChild(a);
  toast('دانلود شروع شد');
}

function statusBadge(st){
  var icon=st==='approved'?I.check:st==='rejected'?I.x:I.clock;
  return '<span class="badge b-'+st+'">'+icon+' '+STATUS_FA[st]+'</span>';
}
function orderBadges(o){
  var h='<span class="ono">#'+displayNo(o.orderNo)+'</span>'+statusBadge(o.status);
  if(o.isSample) h+='<span class="badge b-sample">'+I.flask+' نمونه</span>';
  if(groupVersions(o).length>1||o.version>1) h+='<span class="badge b-ver">نسخه '+faNum(o.version)+'</span>';
  if(o.status==='rejected') h+='<span class="badge b-lock">'+I.lock+' قفل شده</span>';
  return h;
}
function actionBtns(o){
  var b=[];
  b.push('<button class="btn btn-gh btn-sm" data-act="detail" data-id="'+o.id+'">'+I.eye+' جزئیات</button>');
  if(o.file){
    b.push('<button class="btn btn-gh btn-sm" data-act="viewpdf" data-id="'+o.id+'">'+I.file+' مشاهده PDF</button>');
    b.push('<button class="btn btn-gh btn-sm" data-act="dlpdf" data-id="'+o.id+'">'+I.download+' دانلود</button>');
  }
  if(session.role==='accountant'&&o.status==='pending'){
    b.push('<button class="btn btn-ok btn-sm" data-act="approve" data-id="'+o.id+'">'+I.check+' تأیید</button>');
    b.push('<button class="btn btn-dng btn-sm" data-act="reject" data-id="'+o.id+'">'+I.x+' رد</button>');
  }
  if(session.role==='sales'&&o.createdBy===session.username&&o.status==='rejected'){
    b.push('<button class="btn btn-p btn-sm" data-act="resubmit" data-id="'+o.id+'">'+I.refresh+' ارسال مجدد</button>');
  }
  return b.join('');
}

/* ============================================================
   لیست سفارش‌ها — فیلتر تاریخ + جستجو + مرتب‌سازی قدیمی→جدید
============================================================ */
function dateSelectsHTML(side,val){
  var t=todayJ();
  var jy=val?val.jy:t.jy, jm=val?val.jm:t.jm, jd=val?val.jd:t.jd;
  var yo='',mo='',dOp='',y,m,len,d;
  for(y=t.jy-4;y<=t.jy+1;y++) yo+='<option value="'+y+'" '+(y===jy?'selected':'')+'>'+faNum(y)+'</option>';
  for(m=1;m<=12;m++) mo+='<option value="'+m+'" '+(m===jm?'selected':'')+'>'+MONTHS_FA[m-1]+'</option>';
  len=jalaliMonthLen(jy,jm);
  for(d=1;d<=len;d++) dOp+='<option value="'+d+'" '+(d===jd?'selected':'')+'>'+faNum(d)+'</option>';
  return '<div class="dsel" data-side="'+side+'">'+
    '<select class="inp ov-dsel" data-k="y" aria-label="سال">'+yo+'</select>'+
    '<select class="inp ov-dsel" data-k="m" aria-label="ماه">'+mo+'</select>'+
    '<select class="inp ov-dsel" data-k="d" aria-label="روز">'+dOp+'</select></div>';
}
function makeOrdersView(opts){
  var mount=$(opts.mount);
  var t=todayJ();
  var st={preset:'today',query:'',cf:{jy:t.jy,jm:t.jm,jd:1},ct:{jy:t.jy,jm:t.jm,jd:t.jd}};
  function range(){
    if(st.preset==='all') return null;
    if(st.preset==='custom') return {from:jISO(st.cf.jy,st.cf.jm,st.cf.jd),to:jISO(st.ct.jy,st.ct.jm,st.ct.jd)};
    return presetRange(st.preset);
  }
  function filtered(){
    var os=getOrders();
    if(opts.scope==='mine') os=os.filter(function(o){return o.createdBy===session.username});
    var r=range();
    if(r) os=os.filter(function(o){return o.jdate>=r.from&&o.jdate<=r.to});
    var q=st.query.trim().toLowerCase();
    if(q) os=os.filter(function(o){return o.orderNo.toLowerCase().indexOf(q)>-1||o.customer.toLowerCase().indexOf(q)>-1||o.creatorName.toLowerCase().indexOf(q)>-1});
    /* مرتب‌سازی: قدیمی‌ترین → جدیدترین (تاریخ، سپس ساعت ثبت) */
    return os.sort(function(a,b){return a.ts-b.ts||a.createdAt-b.createdAt});
  }
  function renderToolbar(){
    var tb=mount.querySelector('.ov-toolbar'); if(!tb) return;
    var chips=PRESETS.map(function(p){return '<button class="chip '+(st.preset===p[0]?'on':'')+'" data-preset="'+p[0]+'">'+p[1]+'</button>'}).join('');
    var custom=st.preset==='custom'?'<div class="custom-range glass">'+
      '<div class="cr-row"><span>از تاریخ</span>'+dateSelectsHTML('from',st.cf)+'</div>'+
      '<div class="cr-row"><span>تا تاریخ</span>'+dateSelectsHTML('to',st.ct)+'</div></div>':'';
    tb.innerHTML='<div class="chips">'+chips+'</div>'+custom;
    var cs=tb.querySelectorAll('.chip');
    for(var i=0;i<cs.length;i++) cs[i].addEventListener('click',function(){st.preset=this.getAttribute('data-preset');renderToolbar();renderList()});
  }
  function renderSearch(){
    var sw=mount.querySelector('.ov-search'); if(!sw) return;
    sw.innerHTML='<label class="search">'+I.search+'<input placeholder="جستجو: شماره سفارش، نام مشتری، ثبت‌کننده…" value="'+esc(st.query)+'"></label>';
    sw.querySelector('input').addEventListener('input',function(e){st.query=e.target.value;renderList()});
  }
  function syncGroup(g){
    var y=+g.querySelector('[data-k=y]').value, m=+g.querySelector('[data-k=m]').value;
    var dSel=g.querySelector('[data-k=d]'); var cur=+dSel.value||1; var len=jalaliMonthLen(y,m);
    dSel.innerHTML='';
    for(var d=1;d<=len;d++){var op=document.createElement('option');op.value=d;op.textContent=faNum(d);dSel.appendChild(op);}
    dSel.value=Math.min(cur,len);
  }
  function renderList(){
    var listEl=mount.querySelector('.ov-list'); if(!listEl) return;
    var items=filtered();
    var hasAny=getOrders().length>0;
    listEl.innerHTML=items.length?items.map(orderCardHTML).join('')
      : emptyHTML(hasAny?'سفارشی با این فیلتر یافت نشد':'هنوز سفارشی ثبت نشده است',hasAny?'بازه تاریخ یا عبارت جستجو را تغییر دهید':'اولین سفارش از بخش ثبت سفارش ایجاد کنید');
    var cnt=mount.querySelector('.ocount');
    if(cnt) cnt.textContent=items.length?faNum(items.length)+' سفارش':'';
  }
  function render(){
    try{
      mount.innerHTML='<div class="ov-toolbar"></div><div class="ov-search"></div><div class="ocount"></div><div class="ov-list olist"></div>';
      renderToolbar(); renderSearch(); renderList();
    }catch(e){ if(window.console)console.error(e); mount.innerHTML=pageErrorHTML(e); }
  }
  if(!mount.getAttribute('data-bound')){
    mount.setAttribute('data-bound','1');
    mount.addEventListener('change',function(e){
      var tg=e.target;
      if(!tg||!tg.classList||!tg.classList.contains('ov-dsel')) return;
      var g=tg.closest('.dsel'); if(!g) return;
      syncGroup(g);
      var v={jy:+g.querySelector('[data-k=y]').value,jm:+g.querySelector('[data-k=m]').value,jd:+g.querySelector('[data-k=d]').value};
      if(g.getAttribute('data-side')==='from') st.cf=v; else st.ct=v;
      renderList();
    });
  }
  return {render:render,refresh:renderList};
}

function bindOrderForm(mount,onSubmit){

function statTile(icon,color,num,lbl){
  return '<div class="stat glass"><div class="s-ic" style="color:'+color+';background:'+color+'1f;border:1px solid '+color+'44">'+icon+'</div>'+
    '<div><div class="s-num">'+faNum(num)+'</div><div class="s-lbl">'+esc(lbl)+'</div></div></div>';

function renderDashboard(){
  var page=$('#page-dashboard');
  var all=getOrders(), role=session.role;
  var base=role==='sales'?all.filter(function(o){return o.createdBy===session.username}):all;
  function cnt(st){var n=0;for(var i=0;i<base.length;i++)if(base[i].status===st)n++;return n}
  var t=todayJ(), todayISO=jISO(t.jy,t.jm,t.jd);
  var wk=presetRange('thisWeek'), mo=presetRange('thisMonth');
  var now=new Date(), wd=WEEKDAYS_FA[now.getDay()];
  var isMgr=role!=='sales';
  var pendingQ=base.filter(function(o){return o.status==='pending'}).sort(function(a,b){return a.ts-b.ts});
  var rejectedMine=role==='sales'?base.filter(function(o){return o.status==='rejected'}).sort(function(a,b){return a.ts-b.ts}):[];
  var h='<div class="welcome glass"><div><h2>سلام، '+esc(session.name)+' 👋</h2>'+
    '<p>'+wd+'، '+faNum(t.jd)+' '+MONTHS_FA[t.jm-1]+' '+faNum(t.jy)+' · نقش: '+(session.isRoot?'مدیر کل':ROLE_FA[role])+'</p></div>'+
    (role==='sales'?'<button class="btn btn-p" data-navpage="newOrder">'+I.plus+' ثبت سفارش جدید</button>':'')+'</div>';
  h+='<div class="stat-grid">'+
    statTile(I.clipboard,'#5bc8f5',base.length,isMgr?'کل سفارش‌ها':'سفارش‌های من')+
    statTile(I.clock,'#fbbf24',cnt('pending'),'در انتظار بررسی')+
    statTile(I.check,'#4ade80',cnt('approved'),'تأیید شده')+
    statTile(I.x,'#fb7185',cnt('rejected'),'رد شده')+'</div>';
  if(isMgr){
    h+='<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">'+
      statTile(I.calendar,'#2dd4bf',base.filter(function(o){return o.jdate===todayISO}).length,'امروز')+
      statTile(I.calendar,'#2dd4bf',base.filter(function(o){return o.jdate>=wk.from&&o.jdate<=wk.to}).length,'این هفته')+
      statTile(I.calendar,'#2dd4bf',base.filter(function(o){return o.jdate>=mo.from&&o.jdate<=mo.to}).length,'این ماه')+'</div>';
  }
  if(role==='sales'&&rejectedMine.length){
    h+='<div class="subhead"><h3>'+I.alert+' نیازمند اقدام — رد شده‌ها</h3><button data-navpage="myOrders">مشاهده همه</button></div>'+
      '<div class="olist">'+rejectedMine.slice(0,5).map(orderCardHTML).join('')+'</div>';
  }
  if(isMgr){
    h+='<div class="subhead"><h3>'+I.clock+' صف بررسی — در انتظار (قدیمی‌ترین ابتدا)</h3><button data-navpage="orders">مشاهده همه</button></div>'+
      '<div class="olist">'+(pendingQ.length?pendingQ.slice(0,6).map(orderCardHTML).join(''):emptyHTML('سفارشی در انتظار بررسی نیست','از بخش سفارش‌ها سایر بازه‌های زمانی را ببینید'))+'</div>';
  }else{
    h+='<div class="subhead"><h3>'+I.clock+' سفارش‌های در انتظار بررسی</h3><button data-navpage="myOrders">مشاهده همه</button></div>'+
      '<div class="olist">'+(pendingQ.length?pendingQ.slice(0,5).map(orderCardHTML).join(''):emptyHTML('سفارشی در انتظار بررسی ندارید',''))+'</div>';
  }
  page.innerHTML=h;
}

var curPage='dashboard';
function showView(name){
  /* نمایش صریح — مقدار خالی هرگز استفاده نمی‌شود */
  $('#view-login').style.display=(name==='login')?'grid':'none';
  $('#view-app').style.display=(name==='app')?'block':'none';
}
function renderNav(){
  var items=NAV_ITEMS[session.role]||NAV_ITEMS.sales;
  $('#bottomNav').innerHTML=items.map(function(x){return '<button class="bn-btn '+(curPage===x[0]?'on':'')+'" data-navpage="'+x[0]+'">'+I[x[2]]+'<span>'+x[1]+'</span></button>'}).join('');
  $('#sideNav').innerHTML=items.map(function(x){return '<button class="sn-btn '+(curPage===x[0]?'on':'')+'" data-navpage="'+x[0]+'">'+I[x[2]]+'<span>'+x[1]+'</span></button>'}).join('');
}
function goTo(p){
  if(!session){showView('login');return;}
  if(PAGE_ACCESS[session.role].indexOf(p)===-1){toast('دسترسی شما به این بخش مجاز نیست','error');return;}
  curPage=p;
  var pages=document.querySelectorAll('.page'),i;
  for(i=0;i<pages.length;i++) pages[i].classList.remove('active');
  var el=$('#page-'+p); if(el) el.classList.add('active');
  $('#pageTitle').textContent=PAGE_TITLE[p]||'';
  renderNav();
  try{
    if(p==='dashboard') renderDashboard();
    else if(p==='orders') ordersView.render();
    else if(p==='myOrders') myOrdersView.render();
    else if(p==='newOrder') renderNewOrder();
    else if(p==='members') renderMembers();
  }catch(e){
    if(window.console)console.error(e);
    if(el) el.innerHTML=pageErrorHTML(e);
    toast('خطا در نمایش این صفحه','error');
  }
  window.scrollTo(0,0);
}
function rerenderAll(){
  try{
    if(curPage==='dashboard') renderDashboard();
    else if(curPage==='orders') ordersView.refresh();
    else if(curPage==='myOrders') myOrdersView.refresh();
    else if(curPage==='members') renderMembers();
  }catch(e){ if(window.console)console.error(e); }
}
function renderHeader(){
  $('#hdrName').textContent=session.name;
  $('#hdrRole').textContent=session.isRoot?'مدیر کل':ROLE_FA[session.role];
}
function enterApp(){
  showView('app');
  renderHeader();
  if(!ordersView) ordersView=makeOrdersView({mount:'#page-orders',scope:'all'});
  if(!myOrdersView) myOrdersView=makeOrdersView({mount:'#page-myOrders',scope:'mine'});
  goTo('dashboard');
}
function doLogout(){
  DB.del('session'); session=null; closeAllModals();
  var lp=$('#loginPass'); if(lp) lp.value='';
  showView('login');
}

document.addEventListener('click',function(e){
  var tg=e.target; if(!tg||!tg.closest) return;
  var pwd=tg.closest('[data-pwd]');
  if(pwd){var i=$('#'+pwd.getAttribute('data-pwd'));if(i){i.type=i.type==='password'?'text':'password'}return;}
  var nav=tg.closest('[data-navpage]');
  if(nav){goTo(nav.getAttribute('data-navpage'));return;}
  var b=tg.closest('[data-act]');
  if(!b) return;
  var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  safe(function(){
    var o,u2,u3,p;
    if(act==='detail'){openDetail(id);return;}
    if(act==='openver'){closeModal();openDetail(id);return;}
    if(act==='viewpdf'){openPdfModal(id);return;}
    if(act==='dlpdf'){downloadPdf(id);return;}
    if(act==='reject'){openRejectModal(id);return;}
    if(act==='resubmit'){openResubmitModal(id);return;}
    if(act==='adduser'){openUserModal(null);return;}
    if(act==='edituser'){openUserModal(getUsers().filter(function(u){return u.id===id})[0]);return;}
    if(act==='approve'){
      o=findOrder(id); if(!o) return;
      return confirmBox({title:'تأیید سفارش',text:'سفارش #'+o.orderNo+' به نام «'+o.customer+'» تأیید شود؟',okText:'تأیید سفارش'}).then(function(ok){
        if(ok){approveOrder(id);closeAllModals();rerenderAll();}
      });
    }
    if(act==='toggleuser'){
      u2=getUsers().filter(function(x){return x.id===id})[0]; if(!u2) return;
      p=Promise.resolve(true);
      if(u2.active) p=confirmBox({title:'غیرفعال کردن کاربر',text:'کاربر «'+u2.name+'» غیرفعال شود؟ این کاربر دیگر نمی‌تواند وارد سیستم شود.',okText:'غیرفعال کن',danger:true});
      return p.then(function(ok){ if(!ok) return; return updateUser(id,{name:u2.name,username:u2.username,active:!u2.active}).then(renderMembers); });
    }
    if(act==='deluser'){
      u3=getUsers().filter(function(x){return x.id===id})[0]; if(!u3) return;
      return confirmBox({title:'حذف کاربر',text:'کاربر «'+u3.name+'» برای همیشه حذف شود؟ سفارش‌های ثبت‌شده توسط او باقی می‌مانند.',okText:'حذف کاربر',danger:true}).then(function(ok){
        if(ok){deleteUser(id);if(session)renderMembers();}
      });
    }
  });
});
$('#btnLogout').addEventListener('click',function(){
  safe(function(){
    return confirmBox({title:'خروج از سیستم',text:'آیا می‌خواهید از سیستم خارج شوید؟',okText:'خروج',danger:true}).then(function(ok){
      if(ok) doLogout();
    });
  });
});
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  safe(function(){
    var errEl=$('#loginErr'); errEl.classList.remove('on'); errEl.textContent='';
    function fail(m){errEl.textContent=m;errEl.classList.add('on')}
    var un=$('#loginUser').value.trim(), pw=$('#loginPass').value;
    if(!un||!pw) return fail('نام کاربری و رمز عبور را وارد کنید');
    var u=getUsers().filter(function(x){return x.username.toLowerCase()===un.toLowerCase()})[0];
    if(!u) return fail('نام کاربری یا رمز عبور نادرست است');
    if(!u.active) return fail('حساب شما غیرفعال شده است؛ با مدیر تماس بگیرید');
    return hashPassword(pw).then(function(h){
      if(h!==u.passHash) return fail('نام کاربری یا رمز عبور نادرست است');
      session={userId:u.id,username:u.username,name:u.name,role:u.role,isRoot:!!u.isRoot,loginAt:Date.now()};
      saveSession({userId:u.id,loginAt:session.loginAt});
      $('#loginPass').value='';
      enterApp();
      toast('خوش آمدید، '+u.name);
    });
  });
});
/* Debug مخفی — فقط مدیر: ۵ بار کلیک روی لوگو → پاک‌سازی LocalStorage */
var _tap=0,_tapT=null;
$('#logoTap').addEventListener('click',function(){
  _tap++; clearTimeout(_tapT); _tapT=setTimeout(function(){_tap=0},1600);
  if(_tap>=5){ _tap=0; safe(function(){
    if(!session||session.role!=='admin') return;
    return confirmBox({title:'پاک‌سازی کامل (Debug)',text:'تمام داده‌های LocalStorage شامل کاربران، سفارش‌ها و نشست جاری حذف می‌شود. حساب پیش‌فرض MrNami دوباره ساخته خواهد شد.',okText:'پاک‌سازی کامل',danger:true}).then(function(ok){
      if(!ok) return;
      DB.clearAll();
      return ensureDefaultAdmin().then(function(){ doLogout(); toast('حافظه سیستم پاک شد'); });
    });
  });}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('storage',function(){ if(session) rerenderAll(); });

/* ============================================================
   راه‌اندازی
============================================================ */
(function init(){
  try{
    ensureSettings();
    ensureDefaultAdmin().then(function(){
      var s=validateSession();
      if(s){ session=s; enterApp(); }
      else { DB.del('session'); showView('login'); }
    }).catch(function(e){ if(window.console)console.error(e); showView('login'); });
  }catch(e){ if(window.console)console.error(e); showView('login'); }
})();
</script>
