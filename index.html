<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<title>OWM — سامانه مدیریت سفارش‌ها</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#0b1220;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.14);--stroke-soft:rgba(255,255,255,.08);
  --txt:#eef4fb;--txt2:rgba(228,238,248,.75);--txt3:rgba(228,238,248,.5);
  --teal:#2dd4bf;--teal-soft:rgba(45,212,191,.14);
  --gold:#f6b73c;--sky:#5bc8f5;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;
  --purple:#a78bfa;--r:16px;--chip-bg:rgba(255,255,255,.07);--overlay:rgba(4,10,20,.62);
  --glass-shadow:0 16px 40px rgba(2,8,23,.25),inset 0 1px 0 rgba(255,255,255,.08);
}
html.light{
  --bg:#dfe9f3;--panel:rgba(255,255,255,.5);--panel2:rgba(255,255,255,.65);
  --stroke:rgba(255,255,255,.85);--stroke-soft:rgba(15,23,42,.08);
  --txt:#0a1526;--txt2:#1e293b;--txt3:#475569;
  --chip-bg:rgba(255,255,255,.6);--overlay:rgba(15,23,42,.45);
  --glass-shadow:0 16px 40px rgba(15,23,42,.12),inset 0 1px 0 rgba(255,255,255,.95);
}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.8;font-size:14.5px;transition:background .3s,color .3s;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{content-visibility:auto;-webkit-user-drag:none}
svg{display:block}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:9px}
:focus-visible{outline:2px solid rgba(45,212,191,.7);outline-offset:2px}
.load-overlay{position:fixed;inset:0;z-index:200;background:rgba(4,10,20,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.load-box{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:13.5px;text-shadow:0 2px 6px rgba(0,0,0,.5);text-align:center;padding:0 20px;max-width:440px}
.load-box svg{overflow:visible;flex:none}
.pk2-rollspin{animation:pk2roll 1.2s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes pk2roll{to{transform:rotate(360deg)}}
.pk2-beltmove{animation:pk2belt 1s linear infinite}
@keyframes pk2belt{to{stroke-dashoffset:-36}}
.pk2-box{transform-origin:100px 92px;animation:pk2box 6s ease infinite}
@keyframes pk2box{0%,6%{transform:scale(0);opacity:0}12%{transform:scale(1.06);opacity:1}16%{transform:scale(1)}100%{transform:scale(1);opacity:1}}
.pk2-sink{animation:pk2sink 6s cubic-bezier(.34,1.3,.5,1) infinite}
@keyframes pk2sink{0%,14%{transform:translateY(-52px);opacity:0}20%{opacity:1}34%{transform:translateY(0)}100%{transform:translateY(0)}}
.pk2-drop{animation:pk2drop 6s ease infinite}
@keyframes pk2drop{0%,18%{opacity:0;transform:translateY(0)}22%{opacity:1}30%{opacity:0;transform:translateY(8px)}100%{opacity:0}}
.pk2-foamL{animation:pk2foamL 6s ease infinite}
@keyframes pk2foamL{0%,36%{transform:translateY(-26px);opacity:0}44%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
.pk2-foamR{animation:pk2foamR 6s ease infinite}
@keyframes pk2foamR{0%,38%{transform:translateY(-26px);opacity:0}46%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}
.pk2-lidL{transform-origin:78px 79px;animation:pk2lidL 6s ease-in-out infinite}
@keyframes pk2lidL{0%,48%{transform:rotate(-95deg)}58%,100%{transform:rotate(0)}}
.pk2-lidR{transform-origin:122px 79px;animation:pk2lidR 6s ease-in-out infinite}
@keyframes pk2lidR{0%,48%{transform:rotate(95deg)}58%,100%{transform:rotate(0)}}
.pk2-tape{animation:pk2tape 6s ease infinite}
@keyframes pk2tape{0%,60%{transform:translateX(-70px);opacity:0}64%{opacity:1}76%,100%{transform:translateX(0);opacity:1}}
.pk2-strap{transform-origin:100px 92px;animation:pk2strap 6s ease infinite}
@keyframes pk2strap{0%,78%{transform:scaleX(0)}86%,100%{transform:scaleX(1)}}
.pk2-shine{animation:pk2shine 6s ease infinite}
@keyframes pk2shine{0%,88%{transform:translateX(-90px);opacity:0}92%{opacity:.6}98%,100%{transform:translateX(90px);opacity:0}}
.pk2-label{transform-origin:140px 92px;animation:pk2label 6s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes pk2label{0%,90%{transform:scale(2.2);opacity:0}96%,100%{transform:scale(1);opacity:1}}
.pk2-puff{animation:pk2puff 6s ease infinite}
@keyframes pk2puff{0%,70%{opacity:0;transform:translateY(0) scale(.6)}80%{opacity:.7}95%,100%{opacity:0;transform:translateY(-16px) scale(1.2)}}
.pk2-armL{transform-origin:43px 74px;animation:pk2armL 6s ease-in-out infinite}
@keyframes pk2armL{0%{transform:rotate(0)}20%{transform:rotate(26deg)}35%{transform:rotate(8deg)}50%{transform:rotate(22deg)}65%{transform:rotate(-6deg)}80%{transform:rotate(12deg)}100%{transform:rotate(0)}}
.pk2-armR{transform-origin:157px 74px;animation:pk2armR 6s ease-in-out infinite}
@keyframes pk2armR{0%{transform:rotate(0)}20%{transform:rotate(-26deg)}35%{transform:rotate(-8deg)}50%{transform:rotate(-22deg)}65%{transform:rotate(6deg)}80%{transform:rotate(-12deg)}100%{transform:rotate(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes driveIn{0%{transform:translateX(18px);opacity:.2}60%{transform:translateX(-4px)}100%{transform:translateX(0);opacity:1}}
@keyframes blink{50%{opacity:.3}}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(155deg,#0a1120 0%,#0d1b2e 45%,#0a2330 100%);overflow:hidden}
html.light .bg{opacity:1;background:radial-gradient(circle at 15% 20%,rgba(139,92,246,.3) 0%,transparent 45%),radial-gradient(circle at 85% 15%,rgba(59,130,246,.3) 0%,transparent 45%),radial-gradient(circle at 50% 90%,rgba(236,72,153,.2) 0%,transparent 45%),radial-gradient(circle at 80% 75%,rgba(16,185,129,.2) 0%,transparent 45%),linear-gradient(135deg,#d4e4f7 0%,#e4edf9 50%,#f0f6fd 100%)}
.bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.3px);background-size:26px 26px}
html.light .bg:after{background-image:radial-gradient(rgba(15,23,42,.05) 1px,transparent 1.3px)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);display:block;will-change:transform}
.b1{width:52vmax;height:52vmax;background:radial-gradient(circle,rgba(20,184,166,.42),transparent 62%);top:-16vmax;right:-12vmax;animation:fl1 26s ease-in-out infinite alternate}
.b2{width:44vmax;height:44vmax;background:radial-gradient(circle,rgba(246,183,60,.22),transparent 62%);bottom:-14vmax;left:-10vmax;animation:fl2 32s ease-in-out infinite alternate}
.b3{width:38vmax;height:38vmax;background:radial-gradient(circle,rgba(56,152,224,.28),transparent 62%);top:32%;left:28%;animation:fl3 38s ease-in-out infinite alternate}
html.light .b1{background:radial-gradient(circle,rgba(99,102,241,.28),transparent 62%)}
html.light .b2{background:radial-gradient(circle,rgba(244,114,182,.22),transparent 62%)}
html.light .b3{background:radial-gradient(circle,rgba(16,185,129,.22),transparent 62%)}
@keyframes fl1{to{transform:translate(-6vmax,8vmax) scale(1.12)}}
@keyframes fl2{to{transform:translate(7vmax,-6vmax) scale(1.15)}}
@keyframes fl3{to{transform:translate(-8vmax,-5vmax) scale(.9)}}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--glass-shadow)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);padding:30px 24px;animation:rise .6s both}
.logo{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:8px}
.logo-mark{width:62px;height:62px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 12px 30px rgba(45,212,191,.25)}
.logo-mark img{width:100%;height:100%;object-fit:contain}
.brand-name{font-size:38px;font-weight:900;line-height:1;letter-spacing:2px}
.brand-sub{color:var(--txt2);font-size:12.5px;margin-bottom:6px;text-align:center}
.frow{margin-top:14px}
.frow label,.flbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.inp{width:100%;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:11px 14px;color:var(--txt);transition:.2s;min-height:48px;font-size:15px}
.inp::placeholder{color:var(--txt3)}
.inp:focus{outline:none;border-color:rgba(45,212,191,.7);box-shadow:0 0 0 4px rgba(45,212,191,.14)}
textarea.inp{resize:none}
.clr-wrap{position:relative}
.clr-wrap .inp{padding-left:46px}
.clr-btn{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;border-radius:10px;background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt3);font-size:14px;display:grid;place-items:center;transition:.15s}
.clr-btn:active{transform:translateY(-50%) scale(.9);color:var(--red)}
.pwd{position:relative}.pwd .inp{padding-left:52px}
.pwd button{position:absolute;top:5px;bottom:5px;left:6px;width:40px;border:none;background:none;color:var(--txt3);display:grid;place-items:center;border-radius:10px}
.ferr{font-size:12.5px;margin-top:10px;text-align:center;min-height:20px;font-weight:700;color:var(--red)}
.fnote{font-size:11.5px;color:var(--txt3);margin-top:5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel2);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px;margin-top:14px;cursor:pointer}
.switch-row>span:first-child{font-weight:700;font-size:13.5px;color:var(--txt)}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;z-index:2;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--chip-bg);border:1px solid var(--stroke);border-radius:99px;transition:.25s}
.switch i:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#cbd5e1;top:3px;right:3px;transition:.25s}
.switch input:checked+i{background:rgba(45,212,191,.35);border-color:rgba(45,212,191,.6)}
.switch input:checked+i:after{right:26px;background:var(--teal)}
.switch input:disabled+i{opacity:.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;transition:.2s;min-height:48px;text-decoration:none}
.btn:active{transform:scale(.96)}.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(135deg,#2dd4bf,#0e9f9a);color:#04211f;box-shadow:0 8px 22px rgba(45,212,191,.28)}
.btn-p:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ok{background:linear-gradient(135deg,#4ade80,#16a34a);color:#05240f;box-shadow:0 8px 20px rgba(74,222,128,.25)}
.btn-dng{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 8px 20px rgba(225,29,72,.3)}
.btn-gh{background:var(--chip-bg);border:1px solid var(--stroke);color:var(--txt);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn-gh:hover{background:var(--panel2)}
.btn-soft-danger{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:var(--red);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.btn-soft-danger:hover{background:rgba(251,113,133,.22)}
.btn-glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn-glass:hover{background:rgba(255,255,255,.26)}
html.light .btn-glass{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:#0a1526;box-shadow:0 4px 16px rgba(15,23,42,.1)}
.btn-blk{width:100%}
.btn-sm{min-height:40px;padding:7px 13px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-sm svg{width:15px;height:15px}
.btn:disabled{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-pending,.b-review{color:#fcd34d;background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.35)}
html.light .b-pending,html.light .b-review{color:#92400e;background:rgba(251,191,36,.2);border-color:rgba(146,64,14,.35)}
.b-approved{color:#86efac;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
html.light .b-approved{color:#166534;background:rgba(74,222,128,.2);border-color:rgba(22,101,52,.3)}
.b-rejected,.b-cancelled{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
html.light .b-rejected,html.light .b-cancelled{color:#991b1b;background:rgba(244,63,94,.16);border-color:rgba(153,27,27,.3)}
.b-seen{color:#93c5fd;background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.4)}
html.light .b-seen{color:#1e40af;background:rgba(96,165,250,.22);border-color:rgba(30,64,175,.3)}
.b-in_progress{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.42)}
html.light .b-in_progress{color:#075985;background:rgba(91,200,245,.22);border-color:rgba(7,89,133,.3)}
.b-need_production{color:#d8b4fe;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.4)}
html.light .b-need_production{color:#6b21a8;background:rgba(192,132,252,.22);border-color:rgba(107,33,168,.3)}
.b-ready{color:#86efac;background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45)}
html.light .b-ready{color:#166534;background:rgba(74,222,128,.22);border-color:rgba(22,101,52,.35)}
.b-shipped{color:#c7d2fe;background:rgba(165,180,252,.14);border-color:rgba(165,180,252,.45)}
html.light .b-shipped{color:#3730a3;background:rgba(165,180,252,.24);border-color:rgba(55,48,163,.35)}
.b-return_requested{color:#fcd34d;background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55)}
html.light .b-return_requested{color:#92400e;background:rgba(251,191,36,.26);border-color:rgba(146,64,14,.4)}
.b-returned_healthy{color:#86efac;background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35)}
.b-returned_broken{color:#fda4af;background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4)}
.b-sample{color:#f0abfc;background:rgba(232,121,249,.12);border-color:rgba(232,121,249,.4)}
html.light .b-sample{color:#86198f;background:rgba(232,121,249,.18);border-color:rgba(134,25,143,.3)}
.b-ver{color:var(--txt2);background:var(--chip-bg);border-color:var(--stroke)}
html.light .b-ver{color:#334155;background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.15)}
.b-pin{color:#fcd34d;background:rgba(251,191,36,.18);border-color:rgba(251,191,36,.55)}
.r-admin{color:#ffd98a;background:rgba(246,183,60,.13);border-color:rgba(246,183,60,.4)}
html.light .r-admin{color:#92400e;background:rgba(246,183,60,.18);border-color:rgba(146,64,14,.35)}
.r-accountant{color:#aee9fb;background:rgba(91,200,245,.12);border-color:rgba(91,200,245,.4)}
html.light .r-accountant{color:#075985;background:rgba(91,200,245,.2);border-color:rgba(7,89,133,.3)}
.r-sales{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
html.light .r-sales{color:#15803d;background:rgba(74,222,128,.16);border-color:rgba(21,128,61,.3)}
.r-officer{color:#d8b4fe;background:rgba(192,132,252,.12);border-color:rgba(192,132,252,.4)}
html.light .r-officer{color:#6d21a8;background:rgba(192,132,252,.18);border-color:rgba(109,33,168,.3)}
.r-active{color:#86efac;background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35)}
html.light .r-active{color:#15803d;background:rgba(74,222,128,.16);border-color:rgba(21,128,61,.3)}
.r-inactive{color:var(--txt3);background:var(--chip-bg);border-color:var(--stroke)}
html.light .r-inactive{color:#475569;background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.15)}
#view-app{display:none;min-height:100vh}
.topbar{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:8px;margin:10px 12px 0;padding:10px 12px}
.tb-logo{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;user-select:none;cursor:pointer;box-shadow:0 4px 12px rgba(45,212,191,.2)}
.tb-logo img{width:100%;height:100%;object-fit:contain}
.tb-title{font-size:16.5px;font-weight:900;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-chip{margin-right:auto;display:flex;align-items:center;gap:7px;background:var(--chip-bg);border:1px solid var(--stroke);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--txt2);white-space:nowrap;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);flex:none}
.sync-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.sync-chip.ok .dot{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.7)}
.sync-chip.off .dot{background:var(--red)}
.tb-out{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--stroke);background:var(--panel2);color:var(--txt);display:grid;place-items:center;transition:.2s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tb-out:hover{color:var(--teal);background:var(--teal-soft)}
.tb-out svg{width:17px;height:17px}
main{padding:16px 14px 140px;max-width:1100px;margin:0 auto}
.page{display:none}.page.active{display:block;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.sidenav{display:none}
@media(min-width:920px){
  .bottomnav{display:none!important}
  .sidenav{display:flex;flex-direction:column;gap:6px;position:fixed;top:82px;right:18px;width:216px;padding:12px;z-index:30}
  main{margin-right:250px}
  .topbar{margin:12px 18px 0}
  .fab{bottom:26px!important;right:26px!important}
}
.bn-btn,.sn-btn{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--txt3);font-weight:800;font-size:12px;border-radius:14px;transition:.22s}
.bn-btn{flex:1;flex-direction:column;gap:2px;padding:7px 6px;font-size:9.5px;justify-content:center;align-self:center;border-radius:18px;min-width:0}
.bn-btn svg,.sn-btn svg{width:23px;height:23px}
.sn-btn{padding:11px 14px;font-size:13.5px;width:100%;text-align:right}
.sn-btn svg{width:21px;height:21px}
.bn-btn.on,.sn-btn.on{color:#7ff5e6;background:var(--teal-soft);box-shadow:inset 0 0 0 1px rgba(45,212,191,.35)}
html.light .bn-btn.on,html.light .sn-btn.on{color:#0e7490}
.bottomnav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;justify-content:space-around;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-radius:34px;width:min(560px,calc(100% - 16px));gap:4px;background:var(--panel);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--stroke);box-shadow:0 20px 50px rgba(2,8,23,.4),inset 0 1px 0 rgba(255,255,255,.12)}
html.light .bottomnav{box-shadow:0 20px 50px rgba(15,23,42,.18),inset 0 1px 0 rgba(255,255,255,.95)}

function takenAvatarsMap(excludeId){var s={};(FILES.users.data||[]).forEach(function(u){if(u.avatar!=null&&u.id!==excludeId)s[u.avatar]=u.id});return s}
function defaultAvatarFor(name,excludeId){

  var cand=isFemaleName(name)?[0,2,4,6,8,10,12,14,16]:[1,3,5,7,9,11,13,15,17];
  for(var i=0;i<cand.length;i++){if(!taken[cand[i]])return cand[i]}

}

function avatarGridHTML(current,excludeId,gender){

    /* برای جنس مخالف هم به‌عنوان "انتخاب‌شده توسط کاربر دیگر" نمایش می‌دهیم */
    var offG=gender&&avatarGender(a)!==gender;

  }).join('')+'</div>';
}

function fmtDur(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),ss=s%60;return faNum(m)+':'+faPad2(ss)}
function durationText(ms){
  if(ms<0)ms=0;
  var mins=Math.floor(ms/60000);
  var hours=Math.floor(mins/60);
  var days=Math.floor(hours/24);
  if(days>0)return days+' روز '+faNum(hours%24)+' ساعت';

}

}

function sha1Hex(str){
  function rotl(n,s){return(n<<s)|(n>>>(32-s))}
  var utf8=unescape(encodeURIComponent(str));
  var ml=utf8.length;var bytes=[];
  for(var i=0;i<ml;i++)bytes.push(utf8.charCodeAt(i));
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  var bitLen=ml*8;
  bytes.push(0,0,0,0);
  bytes.push((bitLen>>>24)&255,(bitLen>>>16)&255,(bitLen>>>8)&255,bitLen&255);
  var H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];
  for(var b=0;b<bytes.length;b+=64){
    var w=new Array(80);
    for(var i=0;i<16;i++)w[i]=(bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3];
    for(var i=16;i<80;i++)w[i]=rotl(w[i-3]^w[i-8]^w[i-14]^w[i-16],1);
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4];
    for(var i=0;i<80;i++){
      var f,k;
      if(i<20){f=(bb&c)|((~bb)&d);k=0x5A827999}
      else if(i<40){f=bb^c^d;k=0x6ED9EBA1}
      else if(i<60){f=(bb&c)|(bb&d)|(c&d);k=0x8F1BBCDC}
      else{f=bb^c^d;k=0xCA62C1D6}
      var t=(rotl(a,5)+f+e+k+w[i])|0;
      e=d;d=c;c=rotl(bb,30);bb=a;a=t;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;
  }
  var out='';
  for(var i=0;i<5;i++)for(var j=7;j>=0;j--)out+=((H[i]>>>(j*4))&15).toString(16);
  return out;
}
function clCreds(){var l={};try{l=JSON.parse(localStorage.getItem('owm.cl')||'{}')}catch(e){}return{key:l.key||'',secret:l.secret||''}}
function destroyCloudinary(publicId){
  if(!publicId)return Promise.resolve(null);
  var cr=clCreds();
  if(!cr.key||!cr.secret)return Promise.resolve(null);
  var ts=Math.round(Date.now()/1000);
  var sig=sha1Hex('public_id='+publicId+'&timestamp='+ts+cr.secret);
  var fd=new FormData();
  fd.append('public_id',publicId);fd.append('timestamp',ts);fd.append('api_key',cr.key);fd.append('signature',sig);
  return fetch('https://api.cloudinary.com/v1_1/'+CL.cloud+'/image/destroy',{method:'POST',body:fd}).then(function(r){return r.json()}).catch(function(){return null});
}

function toJalaali(gy,gm,gd){
  var g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  var gy2=(gm>2)?(gy+1):gy;
  var days=355666+(365*gy)+~~((gy2+3)/4)-~~((gy2+99)/100)+~~((gy2+399)/400)+gd+g_d_m[gm-1];
  var jy=-1595+(33*~~(days/12053));
  days%=12053;
  jy+=4*~~(days/1461);
  days%=1461;
  if(days>365){jy+=~~((days-1)/365);days=(days-1)%365}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return{jy:jy,jm:jm,jd:jd}
}
function jalaliMonthLen(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return 29}
function todayJ(){var d=new Date();return toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate())}
function jISO(jy,jm,jd){return jy+'/'+pad2(jm)+'/'+pad2(jd)}
function pWeek(d){return(d.getDay()+1)%7}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function jOfDate(d){var j=toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());return jISO(j.jy,j.jm,j.jd)}
function relTime(ts){var diff=Date.now()-ts;if(diff<0)diff=0;var m=Math.floor(diff/60000);if(m<1)return'همین الان';if(m<60)return faNum(m)+' دقیقه پیش';var h=Math.floor(m/60);if(h<24)return faNum(h)+' ساعت پیش';var d=Math.floor(h/24);if(d<30)return faNum(d)+' روز پیش';return faNum(Math.floor(d/30))+' ماه پیش'}
function presetRange(p){
  var now=new Date(),t=todayJ(),tISO=jISO(t.jy,t.jm,t.jd);
  if(p==='today')return{from:tISO,to:tISO};
  if(p==='yesterday'){var s=jOfDate(addDays(now,-1));return{from:s,to:s}}
  if(p==='thisWeek')return{from:jOfDate(addDays(now,-pWeek(now))),to:tISO};
  if(p==='lastWeek')return{from:jOfDate(addDays(now,-pWeek(now)-7)),to:jOfDate(addDays(now,-pWeek(now)-1))};
  if(p==='thisMonth')return{from:jISO(t.jy,t.jm,1),to:tISO};
  if(p==='lastMonth'){var jy=t.jy,jm=t.jm-1;if(jm<1){jm=12;jy--}return{from:jISO(jy,jm,1),to:jISO(jy,jm,jalaliMonthLen(jy,jm))}}
  return null;
}
function chartRangeDays(code){
  var now=new Date();
  if(code==='1w')return{from:addDays(now,-7),to:now};
  if(code==='1m')return{from:addDays(now,-30),to:now};
  if(code==='3m')return{from:addDays(now,-90),to:now};
  if(code==='6m')return{from:addDays(now,-180),to:now};
  if(code==='1y')return{from:addDays(now,-365),to:now};
  return{from:addDays(now,-30),to:now};
}
function utf8ToB64(str){try{var bytes=new TextEncoder().encode(str),bin='',CH=0x8000,i;for(i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(bin)}catch(e){return btoa(unescape(encodeURIComponent(str)))}}
function b64ToUtf8(b64){try{var bin=atob(b64),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new TextDecoder().decode(arr)}catch(e){return decodeURIComponent(escape(atob(b64)))}}

var FILES={users:{rev:0,data:[],pending:false},orders:{rev:0,data:[],pending:false},settings:{rev:0,data:{},pending:false},chat:{rev:0,data:[],pending:false}};
var session=null,rootHash='',viewScope=null,officerUser='',curPage='dashboard',lastSig='',statusFilter='all',overdueAcknowledged={},chartRange='1m';

function migrateOrders(){(FILES.orders.data||[]).forEach(function(o){if(o.status==='completed')o.status='ready'})}

function dataSig(){return(FILES.users.rev||0)+'|'+(FILES.orders.rev||0)+'|'+(FILES.settings.rev||0)+'|'+(FILES.chat.rev||0)}
function ghCfg(){var l={};try{l=JSON.parse(localStorage.getItem('owm.gh')||'{}')}catch(e){}var s=FILES.settings.data||{};return{owner:l.owner||s.owner||'',repo:l.repo||s.repo||'',branch:l.branch||s.branch||'main',token:l.token||s.token||'',pollSec:l.pollSec||s.pollSec||8}}
function ghEnabled(){var c=ghCfg();return!!(c.token&&c.owner&&c.repo)}
function canWrite(){return ghEnabled()&&navigator.onLine!==false}
function assertWritable(){if(!ghEnabled())throw new AppError('سیستم آفلاین است. فقط مدیر کل می‌تواند اتصال را برقرار کند.');if(navigator.onLine===false)throw new AppError('اتصال اینترنت برقرار نیست.')}
function translateErr(e){if(!e)return'خطای نامشخص';if(e.status===401)return'توکن نامعتبر.';if(e.status===403)return'دسترسی توکن کافی نیست.';if(e.status===404)return'ریپازیتوری یا فایل پیدا نشد.';if(e.status===409)return'تداخل همزمان.';if(e.status===422)return'خطا در ذخیره.';if(e.status>=500)return'خطای موقت.';return e.message||'خطای نامشخص'}
function ghApi(path,opts,token){opts=opts||{};var isGet=!opts.method||opts.method==='GET';var headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'Content-Type':'application/json'};return fetch('https://api.github.com'+path,{method:opts.method||'GET',headers:headers,body:opts.body||null,cache:isGet?'no-store':'no-cache'}).then(function(r){if(!r.ok)return r.text().then(function(t){var m='';try{m=JSON.parse(t).message}catch(e){}var e2=new Error(m||('HTTP '+r.status));e2.status=r.status;throw e2});if(r.status===204)return null;return r.json()})}
function fetchFile(file){var c=ghCfg();var url='/repos/'+c.owner+'/'+c.repo+'/contents/'+file+'.json?ref='+encodeURIComponent(c.branch)+'&_t='+Date.now();return ghApi(url,{},c.token).then(function(j){var d;try{d=JSON.parse(b64ToUtf8((j.content||'').replace(/\s/g,'')))}catch(e){d={}}return{data:d,sha:j.sha||null}}).catch(function(e){if(e.status===404)return{data:{},sha:null};throw e})}
function refreshFile(file){if(!ghEnabled())return Promise.resolve();return fetchFile(file).then(function(c){if(FILES[file].pending)return;FILES[file].rev=c.data.rev||0;FILES[file].data=c.data[FILE_KEY[file]]||(file==='settings'?{}:[]);DB.set('cache_'+file,FILES[file])}).catch(function(){})}
function refreshAll(){if(!ghEnabled())return Promise.resolve();return Promise.all(['users','orders','settings','chat'].map(function(f){if(FILES[f].pending)return Promise.resolve();return refreshFile(f)})).then(function(){migrateOrders();if(session){var me=findUserById(session.userId);if(!me||!me.active){toast('حساب شما غیرفعال شده','error');doLogout();return}}var s=dataSig();if(s!==lastSig){lastSig=s;RENDER_ANIM=false;autoRender();handleNewChatMessages()}})}
function autoRender(){if(!session)return;if(curPage==='chat'){renderChatList();return}if(curPage!=='newOrder')renderPage(curPage)}
function rerenderIfNeeded(){if(!session)return;if(curPage==='chat'){renderChatList()}else if(curPage!=='newOrder'){RENDER_ANIM=false;renderPage(curPage)}}
function commitFile(file,applyFn,msg){var c=ghCfg();function attempt(n){return fetchFile(file).then(function(cur){var inner=cur.data[FILE_KEY[file]]||(file==='settings'?{}:[]);var ni=applyFn(JSON.parse(JSON.stringify(inner)));var full={rev:(cur.data.rev||0)+1};full[FILE_KEY[file]]=ni;var body={message:msg||('OWM: '+file),content:utf8ToB64(JSON.stringify(full,null,1)),branch:c.branch};if(cur.sha)body.sha=cur.sha;return ghApi('/repos/'+c.owner+'/'+c.repo+'/contents/'+file+'.json',{method:'PUT',body:JSON.stringify(body)},c.token)}).catch(function(e){if(n<4&&(e.status===409||e.status===422||e.status>=500))return attempt(n+1);throw e})}return attempt(0)}
function mutate(file,applyFn,msg){
  assertWritable();showLoading();
  FILES[file].pending=true;FILES[file].data=applyFn(JSON.parse(JSON.stringify(FILES[file].data)));rerenderIfNeeded();
  return commitFile(file,applyFn,msg).then(function(){hideLoading();FILES[file].pending=false;return refreshFile(file)}).then(function(){lastSig=dataSig();rerenderIfNeeded()}).catch(function(e){hideLoading();FILES[file].pending=false;return refreshFile(file).then(function(){lastSig=dataSig();rerenderIfNeeded();throw new AppError(translateErr(e))})});
}
function hashPassword(pw){var s='owm::'+pw;function fb(){var h1=0xdeadbeef^7,h2=0x41c6ce57^7,i,c;for(i=0;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}return new Promise(function(r){try{if(window.crypto&&crypto.subtle&&TextEncoder){crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){var o='',y=new Uint8Array(b);for(var i=0;i<y.length;i++)o+=('0'+y[i].toString(16)).slice(-2);r(o)}).catch(function(){r(fb())});return}}catch(e){}r(fb())})}
function findUserById(id){for(var i=0;i<FILES.users.data.length;i++)if(FILES.users.data[i].id===id)return FILES.users.data[i];return null}
function findUserByUsername(un){un=un.toLowerCase();for(var i=0;i<FILES.users.data.length;i++)if(FILES.users.data[i].username.toLowerCase()===un)return FILES.users.data[i];return null}

function ensureRootLocal(){if(!Array.isArray(FILES.users.data))FILES.users.data=[];if(findUserByUsername(DEFAULT_ADMIN.username))return Promise.resolve();return hashPassword(DEFAULT_ADMIN.password).then(function(h){FILES.users.data.push({id:'root-mrnami',name:DEFAULT_ADMIN.name,username:DEFAULT_ADMIN.username,passHash:h,role:'admin',active:true,isRoot:true,createdAt:Date.now()});DB.set('cache_users',FILES.users)})}
function persistRootToRemote(){if(!ghEnabled())return Promise.resolve();return fetchFile('users').then(function(cur){var arr=cur.data.users||[];if(arr.some(function(u){return u.username===DEFAULT_ADMIN.username}))return;var r=findUserByUsername(DEFAULT_ADMIN.username);if(!r)return;return commitFile('users',function(a){if(!a.some(function(u){return u.username===DEFAULT_ADMIN.username}))a.push(r);return a},'OWM: root')}).catch(function(){})}

  FILES.users.data.forEach(function(x){if(x.id===u.id){x.lastLoginTs=ts;x.lastDevice=dev}});

function triggerPasswordSave(user,pass){
  try{
    var ifr=document.createElement('iframe');
    ifr.name='pwsave';ifr.style.display='none';
    document.body.appendChild(ifr);
    var f=document.createElement('form');
    f.method='post';f.action=window.location.href;f.target='pwsave';f.setAttribute('autocomplete','on');
    var u=document.createElement('input');u.type='text';u.name='username';u.value=user;u.autocomplete='username';
    var p=document.createElement('input');p.type='password';p.name='password';p.value=pass;p.autocomplete='current-password';
    f.appendChild(u);f.appendChild(p);
    document.body.appendChild(f);
    f.submit();
    setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);if(ifr.parentNode)ifr.parentNode.removeChild(ifr);},3000);
  }catch(e){}
}

function openPdfModal(id,withDetail){
  var o=findOrder(id);if(!o||!o.pdf||!o.pdf.url){toast('فایلی نیست','error');return}
  if(session.role==='officer'&&o.status==='approved')markSeen(id).catch(function(){});
  var imgUrl=pdfPageImg(o.pdf.url,1400);
  var detailBtn=withDetail?'<button class="btn btn-gh" id="pdfDetail">'+I.eye+' جزئیات</button>':'';
  var m=openModal('<div class="m-head"><div class="m-title">'+I.file+' PDF سفارش #'+faNum(o.orderNo)+'</div><button class="m-x" data-close>✕</button></div>'+
    '<div style="font-size:12.5px;color:var(--txt2)">'+esc(o.pdf.name)+' · '+faNum(Math.round((o.pdf.size||0)/1024))+' کیلوبایت</div>'+
    '<img class="pdf-prev-img" src="'+imgUrl+'" alt="پیش‌نمایش PDF" decoding="async">'+
    '<div class="fnote" style="text-align:center;margin-top:8px">پیش‌نمایش داخل همین صفحه</div>'+
    '<div class="m-actions">'+detailBtn+'<button class="btn btn-glass" id="pdfDl">'+I.download+' دانلود</button><button class="btn btn-gh" id="pdfPr">'+I.print+' چاپ</button></div>',{wide:true});
  var img=m.md.querySelector('.pdf-prev-img');
  if(img)img.onerror=function(){var ifr=document.createElement('iframe');ifr.className='pdf-prev';ifr.src=o.pdf.url;if(img.parentNode)img.parentNode.replaceChild(ifr,img)};
  m.md.addEventListener('click',function(e){
    if(e.target.closest('#pdfDl'))safe(function(){downloadPdf(id)});
    if(e.target.closest('#pdfPr'))safe(function(){printOrder(id)});
    if(e.target.closest('#pdfDetail')){closeModal();openDetail(id)}
  });
}
function downloadPdf(id){
  var o=findOrder(id);if(!o||!o.pdf||!o.pdf.url){toast('لینک فایل موجود نیست','error');return}
  if(session.role==='officer'&&!o.downloaded&&o.status==='approved')markSeen(id).catch(function(){});
  showLoading();
  fetch(o.pdf.url).then(function(r){if(!r.ok)throw new Error('x');return r.blob()}).then(function(blob){
    var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=o.pdf.name||('order-'+o.orderNo+'.pdf');document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);hideLoading();toast('دانلود شد')},150);
  }).catch(function(){hideLoading();toast('خطا در دانلود فایل','error')});
}
function legacyImagePrint(o){
  var url=pdfPageImg(o.pdf.url,1600);
  var pre=new Image();
  pre.onload=function(){
    var ifr=document.createElement('iframe');
    ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(ifr);
    var d=ifr.contentDocument;
    d.open();d.write('<html><head><title>Print</title></head><body style="margin:0"><img src="'+url+'" style="width:100%"></body></html>');d.close();
    setTimeout(function(){hideLoading();try{ifr.contentWindow.focus();ifr.contentWindow.print()}catch(e){toast('خطا در چاپ. فایل را دانلود و چاپ کنید.','error')}setTimeout(function(){if(ifr.parentNode)ifr.parentNode.removeChild(ifr)},120000)},500);
  };
  pre.onerror=function(){hideLoading();toast('خطا در آماده‌سازی چاپ','error')};
  pre.src=url;
}
function printBlobIframe(blob,o){
  var url=URL.createObjectURL(blob);
  var ifr=document.createElement('iframe');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  ifr.src=url;
  document.body.appendChild(ifr);
  var done=false;
  ifr.onload=function(){
    setTimeout(function(){
      done=true;hideLoading();
      try{ifr.contentWindow.focus();ifr.contentWindow.print()}catch(e){legacyImagePrint(o)}
      setTimeout(function(){if(ifr.parentNode)ifr.parentNode.removeChild(ifr);URL.revokeObjectURL(url)},120000);
    },600);
  };
  setTimeout(function(){if(!done){done=true;hideLoading();legacyImagePrint(o);if(ifr.parentNode)ifr.parentNode.removeChild(ifr);URL.revokeObjectURL(url)}},8000);
}
function printOrder(id){
  var o=findOrder(id);if(!o||!o.pdf||!o.pdf.url){toast('لینک فایل موجود نیست','error');return}
  var os=detectOS();
  showLoading();
  fetch(o.pdf.url).then(function(r){if(!r.ok)throw new Error('x');return r.blob()}).then(function(blob){
    if(os==='android'){
      var file=null;try{file=new File([blob],o.pdf.name||('order-'+o.orderNo+'.pdf'),{type:'application/pdf'})}catch(e){}
      if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        hideLoading();
        navigator.share({files:[file],title:'سفارش #'+o.orderNo,text:'چاپ سفارش #'+o.orderNo}).then(function(){toast('فایل به سرویس چاپ/اشتراک ارسال شد')}).catch(function(){toast('اشتراک/چاپ لغو شد','warn')});
      }else{hideLoading();legacyImagePrint(o)}
      return;
    }
    if(os==='windows'){printBlobIframe(blob,o);return}
    hideLoading();legacyImagePrint(o);
  }).catch(function(){hideLoading();legacyImagePrint(o)});
}

function displayStatusKey(o){
  if(o.status==='approved'&&!o.downloaded&&!o.seenAt)return 'review';
  return o.status;
}
function statusBadge(o){
  var st=typeof o==='string'?o:displayStatusKey(o);
  var icon=I.clock;
  if(st==='issued')icon=I.file;
  else if(st==='approved'||st==='ready'||st==='shipped'||st==='returned_healthy')icon=I.check;
  else if(st==='rejected'||st==='returned_broken'||st==='cancelled')icon=I.x;
  else if(st==='return_requested'||st==='pending'||st==='review')icon=I.alert;
  else if(st==='in_progress'||st==='need_production')icon=I.refresh;
  else if(st==='seen')icon=I.eye;
  return'<span class="badge b-'+st+'">'+icon+' '+STATUS_FA[st]+'</span>';
}
function orderBadges(o){return'<span class="ono">#'+faNum(o.orderNo)+'</span>'+statusBadge(o)}

function cardTimeline(o){
  var st=o.status;
  var seen=!!(o.downloaded||o.seenAt);
  var items=[];
  items.push({icon:I.file,text:'فاکتور صادر شد',cls:'c-created',state:'done'});
  if(st==='pending'){
    items.push({icon:I.clock,text:'در انتظار تأیید',cls:'c-approved',state:'cur'});
    items.push({icon:I.eye,text:'مشاهده شد',cls:'c-seen',state:'todo'});
    items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'todo'});
    items.push({icon:I.truck,text:'ارسال شد',cls:'c-shipped',state:'todo'});
    if(o.hasCheck)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'todo'});
    return finishTl(items);
  }
  if(st==='rejected'){
    items.push({icon:I.x,text:'رد شد',cls:'c-bad',state:'cur'});
    return finishTl(items);
  }
  items.push({icon:I.check,text:'تأیید شد',cls:'c-approved',state:'done'});
  if(!seen){
    items.push({icon:I.clock,text:'در انتظار بررسی',cls:'c-seen',state:'cur'});
    items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'todo'});
    items.push({icon:I.truck,text:'ارسال شد',cls:'c-shipped',state:'todo'});
    if(o.hasCheck)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'todo'});
    return finishTl(items);
  }
  items.push({icon:I.eye,text:'مشاهده شد',cls:'c-seen',state:'done'});
  if(st==='cancelled'){items.push({icon:I.x,text:'لغو شد',cls:'c-bad',state:'cur'});return finishTl(items)}
  if(st==='in_progress'){
    items.push({icon:I.refresh,text:'در حال انجام',cls:'c-work',state:'cur'});
    items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'todo'});
    items.push({icon:I.truck,text:'ارسال شد',cls:'c-shipped',state:'todo'});
    if(o.hasCheck)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'todo'});
    return finishTl(items);
  }
  if(st==='need_production'){
    items.push({icon:I.flask,text:'نیازمند تولید',cls:'c-work',state:'cur'});
    items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'todo'});
    items.push({icon:I.truck,text:'ارسال شد',cls:'c-shipped',state:'todo'});
    if(o.hasCheck)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'todo'});
    return finishTl(items);
  }
  if(st==='ready'){
    items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'done'});
    items.push({icon:I.truck,text:'ارسال شد',cls:'c-shipped',state:'todo'});
    if(o.hasCheck)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'cur'});
    return finishTl(items);
  }
  items.push({icon:I.box,text:'آماده شد',cls:'c-ready',state:'done'});
  items.push({icon:shipIcon(o.shipMethod),text:'ارسال شد'+(o.shipMethod?' با '+o.shipMethod:''),cls:'c-shipped',state:'done'});
  if(o.hasCheck){
    if(o.checkReceived)items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'done'});
    else items.push({icon:I.creditcard,text:'چک تحویل گرفته شد',cls:'c-check',state:'cur'});
  }
  if(st==='return_requested')items.push({icon:I.back,text:'درخواست مرجوعی',cls:'c-return',state:'cur'});
  if(st==='returned_healthy')items.push({icon:I.check,text:'مرجوعی توسط مسئول سفارش تحویل شد (سالم)',cls:'c-approved',state:'done'});
  if(st==='returned_broken')items.push({icon:I.x,text:'مرجوعی توسط مسئول سفارش تحویل شد (شکسته)',cls:'c-bad',state:'done'});
  return finishTl(items);
}
function finishTl(items){
  var html='<div class="card-timeline">';
  items.forEach(function(it){
    var cls='ct-item '+it.cls+' '+(it.state==='todo'?'todo':it.state==='cur'?'cur':'done');
    html+='<div class="'+cls+'"><div class="ct-dot"></div><div class="ct-content">'+it.icon+'<span>'+esc(it.text)+'</span></div></div>';
  });
  html+='</div>';
  return html;
}

function canDeleteNow(o){
  if(!session||o.deletedAt)return false;
  if(session.role==='admin')return true;
  if(o.returnRequest)return false;
  if(session.role==='accountant')return true;
  if(session.role==='sales'&&o.createdBy===session.username)return!o.downloaded&&(Date.now()-o.createdAt<=DELETE_WINDOW_MS);
  return false;
}
function canCancelInstead(o){if(!session||o.deletedAt||o.returnRequest)return false;if(session.role==='sales'&&o.createdBy===session.username)return o.downloaded&&!o.cancelledAt&&o.status!=='shipped';return false}
function canCancel(o){return session&&session.role==='sales'&&o.createdBy===session.username&&!o.cancelledAt&&!o.deletedAt&&o.status!=='shipped'&&!o.returnRequest}

function actionBtns(o){
  var b=[];
  if((session.role==='admin'||session.role==='accountant')&&(o.status==='pending'||o.status==='approved')){
    b.push('<button class="btn btn-ok btn-sm" data-act="approve" data-id="'+o.id+'" title="تأیید">'+I.check+' تأیید</button>');
    b.push('<button class="btn btn-soft-danger btn-sm" data-act="reject" data-id="'+o.id+'" title="رد">'+I.x+' رد</button>');
  }
  if(session.role==='sales'&&o.createdBy===session.username&&o.status==='rejected')b.push('<button class="btn btn-p btn-sm" data-act="resubmit" data-id="'+o.id+'" title="ارسال مجدد">'+I.refresh+'</button>');
  if(session.role==='admin'&&o.status==='shipped')b.push('<button class="btn btn-gh btn-sm" data-act="adminoverride" data-id="'+o.id+'" title="تغییر وضعیت توسط مدیرکل">⚙️ تغییر وضعیت</button>');
  if(canDeleteNow(o))b.push('<button class="btn btn-soft-danger btn-sm" data-act="delete" data-id="'+o.id+'" title="حذف">'+I.trash+' حذف</button>');
  else if(!o.returnRequest){
    if(canCancelInstead(o))b.push('<button class="btn btn-soft-danger btn-sm" data-act="cancel" data-id="'+o.id+'" title="لغو سفارش">'+I.x+' لغو سفارش</button>');
    else if(canCancel(o)&&!o.downloaded)b.push('<button class="btn btn-soft-danger btn-sm" data-act="cancel" data-id="'+o.id+'" title="لغو سفارش">'+I.x+' لغو سفارش</button>');
  }
  if(session.role==='sales'&&o.createdBy===session.username&&!o.returnRequest&&!o.deletedAt&&!o.cancelledAt&&o.status==='shipped'){
    var fiveH=5*60*60*1000;
    if(Date.now()-(o.shippedAt||o.ts)>=fiveH)b.push('<button class="btn btn-gh btn-sm" data-act="return" data-id="'+o.id+'" title="مرجوعی">'+I.back+' مرجوعی</button>');
  }
  return b.join('');
}
function officerStatusChips(o){
  if(!session||session.role!=='officer')return'';
  if(o.returnRequest)return'';
  var available=[];
  if(o.status==='approved'||o.status==='seen'||o.status==='in_progress'||o.status==='need_production'||o.status==='ready')available=['in_progress','need_production','ready','shipped'];
  if(!available.length)return'';
  return'<div class="status-row">'+available.map(function(s){return'<button class="st-chip '+(o.status===s?'on':'')+'" data-act="'+(s==='shipped'?'ship':'setstatus')+'" data-id="'+o.id+'" data-status="'+s+'">'+STATUS_FA[s]+'</button>'}).join('')+'</div>';
}

function pageErrorHTML(e){return'<div class="empty glass">'+I.alert+'<b>خطا</b>'+esc(e&&e.message?e.message:'')+'</div>'}

function makeOrdersView(opts){
  var mount=$(opts.mount);var t=todayJ();
  var st={preset:opts.defaultPreset||'all',query:'',cf:{jy:t.jy,jm:t.jm,jd:1},ct:{jy:t.jy,jm:t.jm,jd:t.jd}};
  function range(){if(st.preset==='all')return null;if(st.preset==='custom')return{from:jISO(st.cf.jy,st.cf.jm,st.cf.jd),to:jISO(st.ct.jy,st.ct.jm,st.ct.jd)};return presetRange(st.preset)}
  function filtered(){
    var os=visibleOrders();
    if(statusFilter!=='all'){
      if(statusFilter==='notseen')os=os.filter(function(o){return o.status==='approved'&&!o.downloaded});
      else if(statusFilter==='inprogress')os=os.filter(function(o){return o.status==='in_progress'});
      else if(statusFilter==='needprod')os=os.filter(function(o){return o.status==='need_production'});
      else if(statusFilter==='ready')os=os.filter(function(o){return o.status==='ready'});
      else if(statusFilter==='shipped')os=os.filter(function(o){return o.status==='shipped'});
    }
    var r=range();if(r)os=os.filter(function(o){return o.jdate>=r.from&&o.jdate<=r.to});
    var q=st.query.trim().toLowerCase();
    if(q)os=os.filter(function(o){return(o.orderNo+'').toLowerCase().indexOf(q)>-1||(o.title||'').toLowerCase().indexOf(q)>-1||(o.customer||'').toLowerCase().indexOf(q)>-1||(o.creatorName||'').toLowerCase().indexOf(q)>-1});
    os.sort(function(a,b){if(a.pinned&&!b.pinned)return-1;if(!a.pinned&&b.pinned)return 1;return b.ts-a.ts||b.createdAt-a.createdAt});
    return os;
  }
  function renderToolbar(){
    var tb=mount.querySelector('.ov-toolbar');if(!tb)return;
    var row='<div class="filter-row">';
    row+=PRESETS.map(function(p){return'<button class="fchip '+(st.preset===p[0]?'on':'')+'" data-preset="'+p[0]+'">'+p[1]+'</button>'}).join('');
    row+='<span class="fsep"></span>';
    var filters=['all','notseen','inprogress','needprod','ready','shipped'];
    var filterNames={all:'همه',notseen:'دیده نشده',inprogress:'در حال انجام',needprod:'نیازمند تولید',ready:'آماده شد',shipped:'ارسال شده'};
    row+=filters.map(function(f){return'<button class="fchip '+(statusFilter===f?'on':'')+'" data-filter="'+f+'">'+filterNames[f]+'</button>'}).join('');
    row+='</div>';
    var custom=st.preset==='custom'?'<div class="custom-range glass"><div class="cr-row"><span>از</span><div class="cr-cells">'+csBtn('fy',fmtJDateShort(jISO(st.cf.jy,st.cf.jm,st.cf.jd)))+'</div></div><div class="cr-row"><span>تا</span><div class="cr-cells">'+csBtn('ty',fmtJDateShort(jISO(st.ct.jy,st.ct.jm,st.ct.jd)))+'</div></div></div>':'';
    var roleCtl='';
    if(session.role==='sales')roleCtl='<label class="switch-row" style="margin-top:12px"><span>فقط سفارش‌های من</span><span class="switch"><input type="checkbox" class="scopeOwn" '+(viewScope==='own'?'checked':'')+'><i></i></span></label>';

function bindOrderForm(mount,onSubmit){

function computeBars(blob,cb){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC){cb(null);return}
    var ac=new AC();
    var fr=new FileReader();
    fr.onload=function(){
      ac.decodeAudioData(fr.result).then(function(buf){
        var ch=buf.getChannelData(0);var n=28;var step=Math.max(1,Math.floor(ch.length/n));var bars=[];
        for(var i=0;i<n;i++){var s=0,cnt=0;for(var j=0;j<step;j+=Math.max(1,Math.floor(step/40))){s+=Math.abs(ch[i*step+j]||0);cnt++}var v=cnt?s/cnt:0;bars.push(Math.round(18+Math.min(1,v*4)*82))}
        cb(bars);
      }).catch(function(){cb(null)});
    };
    fr.readAsArrayBuffer(blob);
  }catch(e){cb(null)}
}
function defaultBars(seed){
  var h=0;for(var i=0;i<seed.length;i++){h=(h*31+seed.charCodeAt(i))>>>0}
  var bars=[];for(var i=0;i<28;i++){h=(h*1103515245+12345)>>>0;bars.push(20+(h%80))}
  return bars;
}
function buildVoicePlayer(vid,url,dur,bars){
  var bb=bars||defaultBars(vid);
  return '<div class="vplayer" data-vid="'+vid+'" data-url="'+esc(url)+'"><button type="button" class="vp-play" data-vplay>'+I.play+'</button><div class="vp-bars">'+bb.map(function(h){return '<i style="height:'+h+'%"></i>'}).join('')+'</div><span class="vp-cur">0:00</span><span class="vp-dur">'+fmtDur(dur||0)+'</span><button type="button" class="vp-speed">1x</button></div>';
}

function playVp(vp){

function startVoice(){
  if(voiceState)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micPermModal();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime='';
    if(window.MediaRecorder){
      if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
      else if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
    }
    var rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
    var chunks=[];
    var st={rec:rec,stream:stream,chunks:chunks,start:Date.now(),timer:null,blob:null,url:null,dur:0,bars:null};
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop()});
      clearInterval(st.timer);
      var blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
      var url=URL.createObjectURL(blob);
      st.blob=blob;st.url=url;st.dur=Math.min(180,(Date.now()-st.start)/1000);
      computeBars(blob,function(bars){st.bars=bars;voiceState=st;showVoicePanel()});
      var mb=$('#chatSendBtn');if(mb)mb.classList.remove('rec');
      var rb=$('#recBar');if(rb)rb.style.display='none';
    };
    voiceState=st;
    rec.start();
    var rb=$('#recBar');if(rb)rb.style.display='flex';
    var mb=$('#chatSendBtn');if(mb)mb.classList.add('rec');
    st.timer=setInterval(function(){
      var el=$('#recTime');if(el)el.textContent=fmtDur((Date.now()-st.start)/1000);
      if(Date.now()-st.start>=180000)stopVoice();
    },200);
  }).catch(function(){micPermModal()});
}

  btn.addEventListener('pointerdown',function(e){

/* محاسبه میانگین زمان ارسال */
function avgShipTime(){
  var s=FILES.settings.data||{};
  var resetTs=s.avgResetTs||0;
  var orders=FILES.orders.data.filter(function(o){return o.shippedAt&&!o.deletedAt&&o.ts>=resetTs});
  if(!orders.length)return null;
  var total=0;
  orders.forEach(function(o){total+=o.shippedAt-o.ts});
  return total/orders.length;
}

/* رتبه‌بندی مدیران فروش */
function salesRanking(rangeKey){
  var now=new Date();var fromTs=0;
  if(rangeKey==='1w')fromTs=now.getTime()-7*24*60*60*1000;
  else if(rangeKey==='1m')fromTs=now.getTime()-30*24*60*60*1000;
  else if(rangeKey==='1y')fromTs=now.getTime()-365*24*60*60*1000;
  var salesUsers=FILES.users.data.filter(function(u){return u.role==='sales'&&u.active});
  var ranks=salesUsers.map(function(u){
    var orders=FILES.orders.data.filter(function(o){return o.createdBy===u.username&&!o.deletedAt&&o.ts>=fromTs});
    var total=orders.length;
    var returns=orders.filter(function(o){return o.returnRequest}).length;
    var score=total-returns*2;
    return{user:u,total:total,returns:returns,score:score};
  });
  ranks.sort(function(a,b){return b.score-a.score});
  return ranks;
}

function drawChart(){
  var canvas=document.getElementById('chartCanvas');if(!canvas)return;
  var ctx=canvas.getContext('2d');var dpr=window.devicePixelRatio||1;
  var w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
  var rng=chartRangeDays(chartRange);
  var days=Math.max(1,Math.ceil((rng.to-rng.from)/(24*60*60*1000))+1);
  var buckets=[];for(var i=0;i<days;i++)buckets.push(0);
  FILES.orders.data.forEach(function(o){if(o.deletedAt)return;var dd=Math.floor((o.ts-rng.from.getTime())/(24*60*60*1000));if(dd>=0&&dd<days)buckets[dd]++});
  var maxV=1;buckets.forEach(function(v){if(v>maxV)maxV=v});
  var padL=30,padR=10,padT=10,padB=25;var cw=w-padL-padR,ch=h-padT-padB;
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--stroke-soft').trim()||'rgba(255,255,255,.08)';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=padT+ch*(i/4);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke()}
  ctx.strokeStyle='#2dd4bf';ctx.lineWidth=2.5;ctx.beginPath();
  buckets.forEach(function(v,idx){var x=padL+(cw/(days-1||1))*idx;var y=padT+ch-(ch*(v/maxV));if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
  ctx.stroke();
  ctx.lineTo(padL+cw,padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();
  var grd=ctx.createLinearGradient(0,padT,0,padT+ch);grd.addColorStop(0,'rgba(45,212,191,.35)');grd.addColorStop(1,'rgba(45,212,191,0)');
  ctx.fillStyle=grd;ctx.fill();
  ctx.fillStyle='#2dd4bf';
  buckets.forEach(function(v,idx){var x=padL+(cw/(days-1||1))*idx;var y=padT+ch-(ch*(v/maxV));ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--txt3').trim()||'#93a29a';
  ctx.font='10px Vazirmatn';ctx.textAlign='right';
  for(var i=0;i<=4;i++){var y=padT+ch*(i/4);ctx.fillText(faNum(Math.round(maxV*(1-i/4))),padL-4,y+3)}
  var dateEl=document.getElementById('chartDates');if(!dateEl)return;
  var labels=[];var steps=Math.min(6,days);var step=Math.max(1,Math.floor(days/steps));
  for(var i=0;i<days;i+=step){var d=addDays(rng.from,i);var j=toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate());labels.push(fmtJDateShort(jISO(j.jy,j.jm,j.jd)))}
  dateEl.innerHTML=labels.map(function(l){return'<span>'+esc(l)+'</span>'}).join('');
}

function checkOverdueOrders(){

  var now=Date.now();
  var overdue=FILES.orders.data.filter(function(o){

    if(o.status!=='approved'&&o.status!=='seen'&&o.status!=='in_progress'&&o.status!=='need_production'&&o.status!=='ready')return false;
    return(now-o.ts)>OVERDUE_MS;
  });
  var shown=overdue.filter(function(o){var k=o.id,last=overdueAcknowledged[k]||0;return now-last>24*60*60*1000});
  if(!shown.length)return;

  var m=openModal('<div class="m-head"><div class="m-title" style="color:#fcd34d">'+I.bell+' سفارش عقب‌افتاده!</div></div><p style="font-size:14px;color:var(--txt)"><b>#'+faNum(o.orderNo)+'</b> — «'+esc(o.title)+'»</p><p style="font-size:13px;color:#fda4af;margin-top:8px">این سفارش '+faNum(days)+' روز است که در وضعیت «'+STATUS_FA[o.status]+'» مانده!</p><div class="m-actions" style="flex-direction:column"><button class="btn btn-p" id="odAck">همین الان بررسی می‌کنم</button><button class="btn btn-gh" id="odPromise">قول می‌دهم تا فردا انجامش بدهم</button></div>',{static:true});
  m.md.querySelector('#odAck').onclick=function(){overdueAcknowledged[o.id]=now+365*24*60*60*1000;DB.set('overdue_ack',overdueAcknowledged);closeModal();goTo('orders');toast('بررسی می‌کنید…')};
  m.md.querySelector('#odPromise').onclick=function(){overdueAcknowledged[o.id]=now+24*60*60*1000;DB.set('overdue_ack',overdueAcknowledged);closeModal();toast('قول ثبت شد. فردا دوباره یادآوری می‌شود.','warn')};
}

  var rc=tg.closest('[data-react]');
  if(rc){toggleReaction(rc.getAttribute('data-react'),rc.getAttribute('data-remoji'));return}
  var bb=tg.closest('[data-bubble]');
  if(bb){handleBubbleTap(bb.getAttribute('data-bubble'));return}
  var vp=tg.closest('[data-vplay]');
  if(vp){var pl=vp.closest('.vplayer');if(pl)playVp(pl);e.stopPropagation();return}
  var vs=tg.closest('.vp-speed');
  if(vs){var pl2=vs.closest('.vplayer');if(pl2){var sp=pl2.getAttribute('data-speed')==='2'?'1':'2';pl2.setAttribute('data-speed',sp);vs.textContent=sp==='2'?'2x':'1x';vs.classList.toggle('x2',sp==='2');if(activeVp===pl2&&activeAudio)activeAudio.playbackRate=sp==='2'?2:1}return}
  var nav=tg.closest('[data-navpage]');if(nav){e.preventDefault();goTo(nav.getAttribute('data-navpage'));return}
  var b=tg.closest('[data-act]');if(!b)return;
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  safe(function(){
    if(act==='detail'){openDetail(id);return}
    if(act==='reply'){var o=findOrder(id);if(!o)return;chatReply={id:o.id,orderNo:o.orderNo,title:o.title};goTo('chat');return}
    if(act==='viewpdf'){openPdfModal(id,false);return}
    if(act==='dlpdf'){downloadPdf(id);return}
    if(act==='approve'){var o=findOrder(id);if(!o)return;return confirmBox({title:'تأیید سفارش',text:'#'+o.orderNo+' تأیید شود؟',okText:'تأیید'}).then(function(ok){if(ok)return approveOrder(id).then(function(){closeAllModals();renderPage(curPage)})})}
    if(act==='reject'){openRejectModal(id);return}
    if(act==='resubmit'){openResubmitModal(id);return}
    if(act==='return'){openReturnModal(id);return}
    if(act==='cancel'){openCancelModal(id);return}
    if(act==='ship'){openShipModal(id);return}
    if(act==='adminoverride'){openAdminOverrideModal(id);return}
    if(act==='confirmcheck'){return confirmCheckReceived(id).then(function(){renderPage(curPage)})}
    if(act==='setstatus'){var ns=b.getAttribute('data-status');return setOfficerStatus(id,ns).then(function(){RENDER_ANIM=false;renderPage(curPage)})}
    if(act==='pin'){return pinOrder(id).then(function(){RENDER_ANIM=false;renderPage(curPage)})}
    if(act==='delete'){var o=findOrder(id);if(!o)return;return confirmBox({title:'حذف سفارش',text:'#'+o.orderNo+' حذف شود؟ فایل آن از فضای ابری هم حذف خواهد شد.',okText:'حذف',danger:true}).then(function(ok){if(ok)return delOrder(id).then(function(){renderPage(curPage)})})}
    if(act==='adduser'){openUserModal(null);return}
    if(act==='edituser'){openUserModal(findUserById(id));return}
    if(act==='toggleuser'){var u2=findUserById(id);if(!u2)return;var p=Promise.resolve(true);if(u2.active)p=confirmBox({title:'غیرفعال',text:'«'+u2.name+'» غیرفعال شود؟',okText:'بله',danger:true});return p.then(function(ok){if(!ok)return;return updUser(id,{name:u2.name,username:u2.username,active:!u2.active}).then(function(){renderPage(curPage)})})}
    if(act==='deluser'){var u2=findUserById(id);if(!u2)return;return confirmBox({title:'حذف کاربر',text:'«'+u2.name+'» حذف شود؟',okText:'حذف',danger:true}).then(function(ok){if(ok)return delUser(id).then(function(){if(session)renderPage(curPage)})})}
  });
});
document.addEventListener('click',function(e){
  var tg=e.target;if(!tg||!tg.closest)return;
  var btn=tg.closest('[data-returnok]');if(!btn)return;
  var c=btn.getAttribute('data-returnok');
  var md=btn.closest('.modal');if(!md)return;
  var tEl=md.querySelector('.m-title');if(!tEl)return;
  var m=tEl.textContent.match(/#(\d+)/);if(!m)return;
  var orderNo=m[1];var target=null;
  for(var i=0;i<FILES.orders.data.length;i++){if(FILES.orders.data[i].orderNo===orderNo&&FILES.orders.data[i].returnRequest&&FILES.orders.data[i].returnRequest.status==='pending'){target=FILES.orders.data[i];break}}
  if(!target){toast('یافت نشد','error');return}
  safe(function(){return approveReturn(target.id,c).then(function(){closeAllModals();renderPage(curPage)})});
});

['loginUser'].forEach(function(id){
  var inp=$('#'+id);if(!inp)return;
  var btn=document.querySelector('[data-clear="'+id+'"]');
  function upd(){if(btn)btn.style.display=inp.value?'grid':'none'}
  inp.addEventListener('input',upd);inp.addEventListener('change',upd);upd();
});

$('#btnLogout').onclick=function(){safe(function(){return confirmBox({title:'خروج',text:'خارج می‌شوید؟',okText:'خروج',danger:true}).then(function(ok){if(ok)doLogout()})})};
$('#btnSettings').onclick=function(){safe(function(){openSettingsModal()})};
$('#btnTheme').onclick=toggleTheme;
$('#fabNew').onclick=function(){goTo('newOrder')};
$('#fabNew').innerHTML='<svg viewBox="0 0 24 24" width="26" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();var errEl=$('#loginErr'),btn=$('#loginBtn');errEl.textContent='';
  var un=$('#loginUser').value.trim(),pw=$('#loginPass').value;
  if(!un||!pw){errEl.textContent='نام کاربری و رمز را وارد کنید';return}
  btn.disabled=true;btn.textContent='در حال بررسی…';showLoading();
  refreshFile('users').then(function(){
    migrateOrders();
    var u=findUserByUsername(un);
    if(!u)throw new AppError('نام کاربری یا رمز نادرست');
    if(!u.active)throw new AppError('حساب غیرفعال است');
    return hashPassword(pw).then(function(h){
      if(h!==u.passHash)throw new AppError('نام کاربری یا رمز نادرست');
      session={userId:u.id,username:u.username,name:u.name,role:u.role,isRoot:!!u.isRoot,loginAt:Date.now()};
      DB.set('session',{userId:u.id,loginAt:session.loginAt});
      $('#loginPass').value='';btn.disabled=false;btn.textContent='ورود به سیستم';hideLoading();
      recordLogin(u);
      triggerPasswordSave(un,pw);
      enterApp();toast('خوش آمدید، '+u.name);
    });
  }).catch(function(err){hideLoading();btn.disabled=false;btn.textContent='ورود به سیستم';errEl.textContent=(err&&err.message)?err.message:'خطا در ورود'});
});
var _tap=0,_tapT=null;
$('#logoTap').addEventListener('click',function(){
  _tap++;clearTimeout(_tapT);_tapT=setTimeout(function(){_tap=0},1600);
  if(_tap>=5){_tap=0;safe(function(){
    if(!session||session.role!=='admin')return;
    return confirmBox({title:'پاک‌سازی کش',text:'کش محلی پاک شود؟',okText:'پاک کن',danger:true}).then(function(ok){if(!ok)return;['cache_users','cache_orders','cache_settings','cache_chat','session'].forEach(function(k){DB.del(k)});location.reload()});
  })}
});
window.addEventListener('popstate',function(e){
  var r=$('#modalRoot');
  if(r&&r.children.length){closeModal();return}
  if(session&&curPage!=='dashboard'){goTo('dashboard')}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.addEventListener('storage',function(){RENDER_ANIM=false;autoRender()});
window.addEventListener('online',function(){setSyncChip();if(session&&ghEnabled())refreshAll()});
window.addEventListener('offline',function(){setSyncChip()});
window.addEventListener('resize',function(){if(curPage==='reports')setTimeout(drawChart,100)});

(function init(){
  initTheme();
  overdueAcknowledged=DB.get('overdue_ack',{})||{};
  ['users','orders','settings','chat'].forEach(function(f){var c=DB.get('cache_'+f,null);if(c&&c.data!==undefined){FILES[f].rev=c.rev||0;FILES[f].data=c.data}});
  migrateOrders();
  lastSig=dataSig();
  hashPassword(DEFAULT_ADMIN.password).then(function(h){return ensureRootLocal()}).then(function(){
    setSyncChip();if(ghEnabled())return refreshAll().then(function(){return persistRootToRemote()});
  }).then(function(){
    startPoll();setSyncChip();
    var s=validateSession();
    if(s){session=s;enterApp()}else showView('login');
  }).catch(function(e){
    if(window.console)console.error(e);startPoll();setSyncChip();
    var s=validateSession();if(s){session=s;enterApp()}else showView('login');
  });
})();
</script>
