<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f18">
<title>OWM — سامانه مدیریت سفارش‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1f18;--paper:#faf6ea;--paper2:#f1ebd8;--line:#e3dcc8;--ink:#1c2a24;--ink2:#5d6f65;--ink3:#93a29a;--amber:#e8a020;--amber2:#b97b10;--green:#1f9d63;--green2:#157347;--red:#d5544b;--slate:#67788c;--sky:#2b8a9e;--purple:#8a63c9;--r:14px}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.8;font-size:14.5px;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:0;z-index:-2;background-image:radial-gradient(rgba(250,246,234,.05) 1px,transparent 1.4px);background-size:26px 26px}
body:after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(720px 420px at 88% -8%,rgba(232,160,32,.14),transparent 60%),radial-gradient(820px 520px at 4% 108%,rgba(31,157,99,.18),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}svg{display:block}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(28,42,36,.3);border-radius:9px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.glass{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(4,18,12,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(430px,100%);padding:30px 24px;animation:rise .6s both}
.logo{display:flex;align-items:center;gap:13px;justify-content:center;margin-bottom:8px}
.logo-mark{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-family:Lalezar;font-size:16px;letter-spacing:1px;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);transform:rotate(-4deg)}
.brand-name{font-family:Lalezar;font-size:38px;line-height:1}
.brand-sub{color:var(--ink2);font-size:12.5px;text-align:center}
.frow{margin-top:14px}.frow label,.flbl{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);transition:.2s;min-height:48px;font-size:15px}
.inp::placeholder{color:var(--ink3)}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 4px rgba(232,160,32,.18)}
select.inp option{background:var(--paper);color:var(--ink)}
textarea.inp{resize:vertical;min-height:90px}
.pwd{position:relative}.pwd .inp{padding-left:52px}
.pwd button{position:absolute;top:5px;bottom:5px;left:6px;width:40px;border:none;background:none;color:var(--ink3);display:grid;place-items:center;border-radius:10px}
.ferr{font-size:12.5px;margin-top:10px;text-align:center;min-height:20px;font-weight:800;color:var(--red)}
.fnote{font-size:11.5px;color:var(--ink3);margin-top:5px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.switch-row>span:first-child{font-weight:800;font-size:13.5px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;z-index:2;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:#d8d2c2;border:1px solid var(--line);border-radius:99px;transition:.25s}
.switch i:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:rgba(31,157,99,.3);border-color:var(--green)}
.switch input:checked+i:after{right:26px;background:var(--green)}
.switch input:disabled+i{opacity:.4}
.filebox{display:block;border:2px dashed rgba(28,42,36,.3);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;transition:.2s;background:rgba(255,255,255,.4)}
.filebox:hover{border-color:var(--amber);background:rgba(232,160,32,.08)}
.filebox svg{margin:0 auto 8px;color:var(--amber2)}
.filebox b{display:block;font-size:14px}.filebox small{color:var(--ink3);font-size:11.5px}
.filebox .fmeta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.filebox.has{border-style:solid;border-color:var(--green);background:rgba(31,157,99,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 18px;font-weight:800;font-size:14px;transition:.2s;min-height:48px;text-decoration:none}
.btn:active{transform:scale(.96)}.btn svg{width:18px;height:18px}
.btn-p{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#241503;box-shadow:0 6px 18px rgba(232,160,32,.35)}
.btn-p:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ok{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 6px 16px rgba(31,157,99,.3)}
.btn-dng{background:linear-gradient(135deg,var(--red),#b23a32);color:#fff;box-shadow:0 6px 16px rgba(213,84,75,.3)}
.btn-gh{background:#fff;border:2px solid var(--line);color:var(--ink2)}
.btn-gh:hover{border-color:var(--ink);color:var(--ink)}
.btn-blk{width:100%}.btn-sm{min-height:40px;padding:7px 13px;font-size:12.5px;border-radius:10px;gap:6px}.btn-sm svg{width:15px;height:15px}
.btn:disabled{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px}
.b-pending{color:var(--amber2);background:rgba(232,160,32,.12);border-color:rgba(232,160,32,.4)}
.b-approved{color:var(--green2);background:rgba(31,157,99,.12);border-color:rgba(31,157,99,.4)}
.b-rejected{color:var(--red);background:rgba(213,84,75,.1);border-color:rgba(213,84,75,.4)}
.b-seen,.b-in_progress{color:var(--sky);background:rgba(43,138,158,.1);border-color:rgba(43,138,158,.4)}
.b-need_production{color:var(--purple);background:rgba(138,99,201,.1);border-color:rgba(138,99,201,.4)}
.b-completed{color:var(--green2);background:rgba(31,157,99,.14);border-color:rgba(31,157,99,.5)}
.b-shipped{color:#4a5f9e;background:rgba(90,110,190,.12);border-color:rgba(90,110,190,.4)}
.b-return_requested{color:var(--amber2);background:rgba(232,160,32,.16);border-color:rgba(232,160,32,.55);animation:pulseBd 1.4s infinite}
.b-returned_healthy{color:var(--green2);background:rgba(31,157,99,.12);border-color:rgba(31,157,99,.4)}
.b-returned_broken{color:var(--red);background:rgba(213,84,75,.1);border-color:rgba(213,84,75,.4)}
@keyframes pulseBd{0%,100%{box-shadow:0 0 0 0 rgba(232,160,32,.35)}50%{box-shadow:0 0 0 6px rgba(232,160,32,0)}}
.b-sample{color:var(--sky);background:rgba(43,138,158,.1);border-color:rgba(43,138,158,.4)}
.b-ver{color:var(--ink2);background:var(--paper2);border-color:var(--line)}
.b-lock{color:var(--ink3);background:transparent;border-color:transparent}
.r-admin{color:var(--amber2);background:rgba(232,160,32,.13);border-color:rgba(232,160,32,.4)}
.r-accountant{color:var(--sky);background:rgba(43,138,158,.1);border-color:rgba(43,138,158,.4)}
.r-sales{color:var(--green2);background:rgba(31,157,99,.1);border-color:rgba(31,157,99,.4)}
.r-officer{color:var(--purple);background:rgba(138,99,201,.1);border-color:rgba(138,99,201,.4)}
.r-active{color:var(--green2);background:rgba(31,157,99,.1);border-color:rgba(31,157,99,.4)}
.r-inactive{color:var(--ink3);background:var(--paper2);border-color:var(--line)}
#view-app{display:none;min-height:100vh}
.topbar{position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:10px;margin:10px 12px 0;padding:9px 14px}
.tb-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Lalezar;font-size:12px;color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.3);flex:none;user-select:none;cursor:pointer;transform:rotate(-4deg)}
.tb-title{font-family:Lalezar;font-size:20px;line-height:1.2}
.tb-sub{font-size:10.5px;color:var(--ink2)}
.sync-chip{margin-right:auto;display:flex;align-items:center;gap:7px;background:var(--paper2);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.sync-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.sync-chip.ok .dot{background:var(--green);box-shadow:0 0 8px rgba(31,157,99,.6)}
.sync-chip.off .dot{background:var(--red)}
.tb-user{text-align:right;line-height:1.4;min-width:0}
.tb-user b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:20vw}
.tb-user span{font-size:10.5px;color:var(--ink2)}
.tb-out{width:42px;height:42px;flex:none;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink2);display:grid;place-items:center;transition:.2s}
.tb-out:hover{color:#fff;background:var(--red);border-color:var(--red)}
main{padding:16px 14px 120px;max-width:1100px;margin:0 auto}
.page{display:none}.page.active{display:block;animation:rise .45s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.sidenav{display:none}
@media(min-width:920px){.bottomnav{display:none!important}.sidenav{display:flex;flex-direction:column;gap:6px;position:fixed;top:82px;right:18px;width:216px;padding:12px;z-index:30}main{margin-right:250px;padding-bottom:40px}.topbar{margin:12px 18px 0}}
.bn-btn,.sn-btn{display:flex;align-items:center;gap:10px;border:none;background:none;color:var(--ink2);font-weight:800;font-size:12px;border-radius:14px;transition:.22s}
.bn-btn{flex-direction:column;gap:3px;padding:7px 12px;font-size:10.5px}
.bn-btn svg,.sn-btn svg{width:22px;height:22px}
.sn-btn{padding:11px 14px;font-size:13.5px;width:100%;text-align:right}
.bn-btn.on,.sn-btn.on{color:var(--amber2);background:rgba(232,160,32,.14);box-shadow:inset 0 0 0 1px rgba(232,160,32,.4)}
.bottomnav{position:fixed;bottom:10px;left:10px;right:10px;z-index:40;display:flex;justify-content:space-around;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.welcome{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;margin-bottom:16px}
.welcome h2{font-family:Lalezar;font-size:24px}
.welcome p{font-size:12.5px;color:var(--ink2)}
.welcome .btn{margin-right:auto}
.alert-banner{background:rgba(232,160,32,.14);border:1px solid rgba(232,160,32,.5);color:var(--amber2);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;animation:pulseBd 1.6s infinite}
.alert-banner svg{width:19px;height:19px;flex:none}
.offline-banner{background:rgba(213,84,75,.1);border:1px solid rgba(213,84,75,.4);color:var(--red);border-radius:14px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.offline-banner svg{width:19px;height:19px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
@media(min-width:760px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;gap:12px;align-items:center;padding:15px 16px;transition:.25s}
.stat:hover{transform:translateY(-2px)}
.s-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.s-ic svg{width:22px;height:22px}
.s-num{font-family:Lalezar;font-size:26px;line-height:1.3}
.s-lbl{font-size:11.5px;color:var(--ink2)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.subhead h3{font-family:Lalezar;font-size:19px;display:flex;align-items:center;gap:8px}
.subhead h3 svg{width:18px;height:18px;color:var(--amber2)}
.subhead button{border:none;background:none;color:var(--amber2);font-size:12.5px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:#fff;border:2px solid var(--line);color:var(--ink2);font-size:12.5px;font-weight:800;transition:.2s;min-height:40px}
.chip.on{background:rgba(232,160,32,.14);color:var(--amber2);border-color:var(--amber)}
.custom-range{margin-top:12px;padding:14px;display:grid;gap:10px}
.custom-range .cr-row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center}
.custom-range .cr-row>span{font-size:12.5px;font-weight:800;color:var(--ink2)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:13px;padding:0 14px;min-height:48px;margin-top:12px}
.search:focus-within{border-color:var(--amber)}
.search svg{color:var(--ink3);flex:none;width:18px;height:18px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);min-height:46px;font-size:14px}
.ocount{font-size:12px;color:var(--ink3);margin:12px 2px 8px}
.olist{display:flex;flex-direction:column;gap:12px}
.ocard{padding:16px;transition:.25s;animation:rise .4s both}
.ocard:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(4,18,12,.45)}
.ocard-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.ono{font-family:Lalezar;font-size:16px;background:var(--paper2);padding:2px 12px;border-radius:10px;border:1px solid var(--line)}
.oprev{position:relative;width:100%;height:150px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;margin-bottom:10px}
.oprev-ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3)}
.oprev-ico svg{width:30px;height:30px}
.oprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:rotate(90deg)}
.ocust{font-family:Lalezar;font-size:19px;margin-bottom:2px;word-break:break-word}
.osub{font-size:12px;color:var(--ink2);margin-bottom:8px}
.oinfo{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;color:var(--ink2)}
.oinfo span{display:inline-flex;align-items:center;gap:6px}
.oinfo svg{width:15px;height:15px;color:var(--ink3);flex:none}
.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.st-chip{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);color:var(--ink2);font-size:12.5px;font-weight:800;transition:.2s}
.st-chip.on{color:#fff;background:var(--green);border-color:var(--green)}
.oacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{padding:46px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:46px;height:46px;margin:0 auto 12px;opacity:.45}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.mcard{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap;animation:rise .4s both}
.m-ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:Lalezar;font-size:19px;color:#fff;background:linear-gradient(135deg,var(--green),var(--green2));flex:none}
.m-info{min-width:110px}.m-info b{display:block;font-size:14.5px}
.m-info span{font-size:11.5px;color:var(--ink3);direction:ltr;display:inline-block}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.m-date{font-size:11px;color:var(--ink3)}
.m-acts{display:flex;gap:7px;margin-right:auto}
.ibtn{width:40px;height:40px;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--ink2);display:grid;place-items:center;transition:.2s}
.ibtn:hover{color:#fff;background:var(--ink);border-color:var(--ink)}
.ibtn.danger:hover{background:var(--red);border-color:var(--red)}
.ibtn svg{width:17px;height:17px}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(4,14,10,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:620px;max-height:93vh;overflow-y:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 60px rgba(0,0,0,.5);animation:sheetUp .38s both}
@keyframes sheetUp{from{transform:translateY(70px);opacity:0}}
@media(min-width:720px){.overlay{align-items:center;padding:24px}.modal{border-radius:24px;border-bottom:1px solid var(--line)}}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.m-title{font-family:Lalezar;font-size:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-title svg{width:19px;height:19px;color:var(--amber2)}
.m-x{width:38px;height:38px;flex:none;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--ink2);font-size:15px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.drow span{color:var(--ink2);flex:none}.drow b{font-weight:800;text-align:right}
.rbox{border-radius:13px;padding:13px 15px;margin-top:14px;font-size:13px;border:1px solid;line-height:2}
.rbox svg{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-left:4px}
.rbox.ok{background:rgba(31,157,99,.08);border-color:rgba(31,157,99,.4)}
.rbox.bad{background:rgba(213,84,75,.08);border-color:rgba(213,84,75,.4)}
.rbox.warn{background:rgba(232,160,32,.1);border-color:rgba(232,160,32,.5);color:var(--amber2)}
.rbox b{display:inline-block;min-width:104px;color:var(--ink2);font-weight:800}
.rbox .reason{background:rgba(0,0,0,.05);border-radius:9px;padding:8px 12px;margin-top:6px}
.locknote{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink2);background:var(--paper2);border:1px dashed var(--line);border-radius:11px;padding:9px 13px;line-height:1.9}
.locknote svg{width:16px;height:16px;flex:none;color:var(--amber2)}
.ver-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ver-row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13px}
.ver-row.cur{border-color:var(--amber);background:rgba(232,160,32,.08)}
.m-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.m-actions .btn{flex:1;min-width:110px}
.sec-title{font-family:Lalezar;font-size:16px;color:var(--ink2);margin:20px 0 4px;display:flex;align-items:center;gap:8px}
.sec-title svg{width:15px;height:15px}
.sec-title:after{content:"";flex:1;height:1px;background:var(--line)}
.pdf-prev{width:100%;height:60vh;border:none;border-radius:13px;background:#fff;margin-top:10px}
.tline{position:relative;padding-right:20px;margin-top:10px}
.tline:before{content:"";position:absolute;right:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl-item{position:relative;padding:7px 0}
.tl-item:before{content:"";position:absolute;right:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,157,99,.18)}
.tl-item.c-approved:before{background:var(--green)}.tl-item.c-rejected:before{background:var(--red)}
.tl-item.c-resubmitted:before,.tl-item.c-return:before{background:var(--amber)}
.tl-item.c-status:before{background:var(--purple)}.tl-item.c-deleted:before{background:var(--ink3)}

function hashPassword(pw){var s='owm::'+pw;function fb(){var h1=0xdeadbeef^7,h2=0x41c6ce57^7,i,ch;for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}return new Promise(function(res){try{if(window.crypto&&crypto.subtle&&window.TextEncoder){crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){var o='',by=new Uint8Array(b);for(var i=0;i<by.length;i++)o+=('0'+by[i].toString(16)).slice(-2);res(o)}).catch(function(){res(fb())});return}}catch(e){}res(fb())})}
